name: C003 MuseTalk FPS Patch QA
on:
  push:
    branches: [fix/c003-audit-blockers]
    paths:
      - 'kaggle/c003_musetalk_fps_patch.py'
      - '.github/workflows/c003-musetalk-fps-patch.yml'
permissions:
  contents: write
jobs:
  patch-and-double-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/c003-audit-blockers
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply exact FPS-tolerance fix
        shell: bash
        run: |
          set -euo pipefail
          python kaggle/c003_musetalk_fps_patch.py --apply --verify
          git diff --check
          git add kaggle/first_gate_alignment_render.py kaggle/test_c003_release.py
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Enforce approved MuseTalk FPS tolerance without frame resampling'
      - name: Double complete CPU preflight
        shell: bash
        env:
          KAGGLE_USERNAME: audit-user
          KAGGLE_PRIVATE_DATASET: audit-user/dry-run
          GITHUB_RUN_ATTEMPT: '1'
        run: |
          set -euo pipefail
          python -m pip install --quiet 'PyYAML>=6,<7'
          export GITHUB_SHA="$(git rev-parse HEAD)"
          export GITHUB_RUN_ID="${{ github.run_id }}"
          for pass in 1 2; do
            echo "C003_MUSETALK_FPS_CPU_PASS_${pass}"
            python kaggle/test_c003_release.py
            python kaggle/c003_release_safety.py --verify
            python kaggle/audit_c003_source.py
            python kaggle/recover_c003_readonly.py --dry-run
          done
          git diff --check
      - name: Publish doubly verified source
        shell: bash
        run: git push origin HEAD:fix/c003-audit-blockers
      - name: Summary
        run: echo 'CPU-only FPS tolerance patch; no GPU, private media access, promotion, or stable overwrite.'
