name: C003 Recover Existing Verified Output
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/c003-recover-existing-output.yml'
permissions:
  contents: read
jobs:
  recover-existing-output:
    if: github.event.head_commit.message == 'Recover verified existing C003 output without rerender'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_PRIVATE_DATASET: ${{ secrets.KAGGLE_PRIVATE_DATASET }}
      EXPECTED_SOURCE_SHA: 037fd48a64b4311cc71fbc8c842136a70c71e30a
      EXPECTED_RUN_TOKEN: 34083448702-1
      EXPECTED_CANDIDATE: MASTER_CLONE_GATE_08_15_CANDIDATE_003
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 037fd48a64b4311cc71fbc8c842136a70c71e30a
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Double source verification without GPU
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          python -m pip install --quiet 'PyYAML>=6,<7' 'kaggle>=1.8.0' 'kagglehub>=0.3.13'
          export GITHUB_SHA="$EXPECTED_SOURCE_SHA"
          export GITHUB_RUN_ID="34083448702"
          export GITHUB_RUN_ATTEMPT="1"
          for pass in 1 2; do
            echo "C003_EXISTING_RECOVERY_PREFLIGHT_${pass}"
            python kaggle/test_c003_release.py
            python kaggle/c003_release_safety.py --verify
            python kaggle/audit_c003_source.py
            python kaggle/recover_c003_readonly.py --dry-run
          done
      - name: Recover and verify already-rendered C003 only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          test -n "$KAGGLE_USERNAME"
          mkdir -p .kaggle-existing .kaggle-review
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          import kagglehub

          expected_source = os.environ['EXPECTED_SOURCE_SHA']
          expected_token = os.environ['EXPECTED_RUN_TOKEN']
          candidate = os.environ['EXPECTED_CANDIDATE']
          handle = os.environ['KAGGLE_USERNAME'] + '/zaskaleta-c003-recovery-34083448702-1'
          root = Path('.kaggle-existing')
          review = Path('.kaggle-review')
          base = 'first_gate_alignment/' + candidate

          def sha(path):
              h = hashlib.sha256()
              with Path(path).open('rb') as f:
                  for chunk in iter(lambda: f.read(1024*1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          def download(path):
              p = Path(kagglehub.notebook_output_download(handle, path=path, output_dir=str(root), force_download=True))
              if p.is_dir():
                  p = p / Path(path).name
              if not p.is_file():
                  raise RuntimeError('Missing exact Kaggle output: ' + path)
              return p

          status_path = download('zaskaleta_autopilot_status.json')
          evidence_path = download(base + '.evidence.json')
          video_path = download(base + '.mp4')
          provenance_path = download(base + '.provenance.json')
          status = json.loads(status_path.read_text(encoding='utf-8'))
          evidence = json.loads(evidence_path.read_text(encoding='utf-8'))
          provenance = json.loads(provenance_path.read_text(encoding='utf-8'))

          def require(ok, msg):
              if not ok:
                  raise RuntimeError(msg)

          require(status.get('run_token') == expected_token, 'Wrong status run token')
          require(status.get('source_sha') == expected_source, 'Wrong status source SHA')
          require(status.get('state') == 'FIRST_GATE_CANDIDATE_003_READY_FOR_MANUAL_REVIEW', 'Wrong final state')
          require(status.get('first_gate_candidate_id') == candidate and status.get('render_completed') is True, 'Wrong/incomplete candidate')
          require(evidence.get('run_token') == expected_token and evidence.get('source_sha') == expected_source, 'Wrong evidence run identity')
          require(evidence.get('candidate_id') == candidate and evidence.get('technical_gate_pass') is True, 'Technical gate failed')
          require(8 <= float(evidence.get('render_duration_seconds', 0)) <= 15, 'Duration gate failed')
          require(evidence.get('promotion_allowed') is False and evidence.get('auto_promote') is False, 'Promotion safety violation')
          require(evidence.get('stable_release_modified') is False, 'Stable release safety violation')
          video_sha = sha(video_path)
          provenance_sha = sha(provenance_path)
          require(video_sha == evidence.get('render_sha256'), 'MP4 SHA-256 mismatch')
          require(provenance_sha == evidence.get('provenance_sha256'), 'Private provenance SHA-256 mismatch')
          require(provenance.get('candidate_id') == candidate, 'Wrong provenance candidate')
          require(provenance.get('final_render_sha256') == video_sha, 'Provenance does not identify final MP4')
          require(provenance.get('promotion_allowed') is False and provenance.get('auto_promote') is False, 'Provenance promotion safety violation')
          require(provenance.get('stable_release_modified') is False, 'Provenance stable release violation')

          # Repeat the critical output checks a second time before export.
          require(sha(video_path) == video_sha == evidence['render_sha256'], 'Second MP4 verification failed')
          require(sha(provenance_path) == provenance_sha == evidence['provenance_sha256'], 'Second provenance verification failed')

          out_video = review / (candidate + '.mp4')
          out_video.write_bytes(video_path.read_bytes())
          safe = {
              'schema': 'zaskaleta-c003-public-review-v1',
              'candidate_id': candidate,
              'source_sha': expected_source,
              'run_token': expected_token,
              'final_render_sha256': video_sha,
              'render_duration_seconds': evidence['render_duration_seconds'],
              'lipsync_sample_rate': evidence.get('lipsync_sample_rate'),
              'final_audio_sample_rate': evidence.get('final_audio_sample_rate'),
              'single_component_change': evidence.get('single_component_change'),
              'subjective_identity_review': evidence.get('subjective_identity_review'),
              'promotion_allowed': False,
              'auto_promote': False,
              'stable_release_modified': False,
          }
          safe_path = review / (candidate + '.provenance.json')
          safe_path.write_text(json.dumps(safe, indent=2) + '\n', encoding='utf-8')
          manifest = {
              'kernel': handle,
              'version': 1,
              'run_token': expected_token,
              'source_sha': expected_source,
              'candidate_id': candidate,
              'render_sha256': video_sha,
              'safe_provenance_sha256': sha(safe_path),
              'manual_review': 'PENDING_MANUAL_REVIEW',
              'auto_promote': False,
              'recovered_existing_render': True,
              'new_gpu_render_started': False,
          }
          (review / 'C003_verified_manifest.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({'candidate_id': candidate, 'run_token': expected_token, 'source_sha': expected_source, 'render_sha256': video_sha, 'recovered_existing_render': True}, indent=2))
          PY
      - name: Upload verified existing C003
        uses: actions/upload-artifact@v4
        with:
          name: master-clone-c003-existing-verified-${{ github.run_id }}
          path: |
            .kaggle-review/MASTER_CLONE_GATE_08_15_CANDIDATE_003.mp4
            .kaggle-review/MASTER_CLONE_GATE_08_15_CANDIDATE_003.provenance.json
            .kaggle-review/C003_verified_manifest.json
          if-no-files-found: error
          retention-days: 7
      - name: Safety summary
        if: always()
        run: |
          echo 'Recovery-only: no new Kaggle kernel push, no GPU render, no stable overwrite, no promotion.'
          echo 'Only exact verified MP4 and sanitized metadata are exported.'
