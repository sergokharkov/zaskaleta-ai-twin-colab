name: C004 Final CPU Preflight
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/c004-final-cpu-preflight.yml'
      - '.github/workflows/c004-kaggle-gpu-launch.yml'
  workflow_dispatch:
    inputs:
      confirm_reviewed_source:
        description: 'I reviewed authentic 50380.mp4 (25.0-32.5s) and derived C004 (8.24s); approve motion/talking only, no identity-anchor replacement'
        type: boolean
        required: true
        default: false
concurrency:
  group: c004-private-cpu-qa
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  final-real-source-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CONFIRM_REVIEWED_SOURCE: ${{ inputs.confirm_reviewed_source }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_PRIVATE_DATASET: ${{ secrets.KAGGLE_PRIVATE_DATASET }}
      CANDIDATE: MASTER_CLONE_GATE_08_15_CANDIDATE_004
      SEGMENT: 50380_face_motion_25_32_5_stretched_8_24
      SOURCE: C004_SOURCE_50380_FACE_MOTION_8_25_CROPPED.mp4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet 'kaggle>=1.8.0'
      - name: Download exact private C004 inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"; test -n "$KAGGLE_USERNAME"; test -n "$KAGGLE_PRIVATE_DATASET"
          rm -rf .c004-final && mkdir -p .c004-final/private .c004-final/work .c004-final/out
          kaggle datasets download -d "$KAGGLE_PRIVATE_DATASET" -p .c004-final/private --unzip -q
          test -f ".c004-final/private/${SOURCE}"
          test -f .c004-final/private/c004_private_approval.json
          test -f .c004-final/private/c004_duplicate_priors/C001.mp4
          test -f .c004-final/private/c004_duplicate_priors/C002.mp4
          test -f .c004-final/private/c004_duplicate_priors/C003.mp4
      - name: Record optional explicit source-owner attestation privately
        if: ${{ inputs.confirm_reviewed_source == true }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import json, os
          from pathlib import Path
          if os.environ.get('CONFIRM_REVIEWED_SOURCE')!='true':
              raise SystemExit('explicit source review checkbox required')
          if os.environ.get('GITHUB_EVENT_NAME')!='workflow_dispatch' or os.environ.get('GITHUB_REF')!='refs/heads/main':
              raise SystemExit('manual dispatch on main required')
          if os.environ.get('GITHUB_ACTOR')!='sergokharkov' or os.environ.get('GITHUB_TRIGGERING_ACTOR')!='sergokharkov':
              raise SystemExit('source owner must submit the attestation')
          path=Path('.c004-final/private/c004_private_approval.json')
          approval=json.loads(path.read_text())
          expected={
              'candidate_id':'MASTER_CLONE_GATE_08_15_CANDIDATE_004',
              'source_segment_id':'50380_face_motion_25_32_5_stretched_8_24',
              'source_asset_id':'50380.mp4',
              'source_path':'C004_SOURCE_50380_FACE_MOTION_8_25_CROPPED.mp4',
              'segment_start_seconds':0.0,'segment_end_seconds':8.24,
              'identity_anchor_replacement_allowed':False}
          public=json.loads(Path('content/c004_source_manifest_v1.json').read_text())
          if public.get('candidate_id')!=expected['candidate_id']:
              raise SystemExit('manifest candidate mismatch')
          for key,value in expected.items():
              if approval.get(key)!=value:
                  raise SystemExit('approval scope mismatch: '+key)
              if key!='candidate_id' and public['source_selection'].get(key)!=value:
                  raise SystemExit('manifest scope mismatch: '+key)
          if approval.get('approved') is True:
              print('Existing approval preserved; normal validation follows.')
          else:
              if approval.get('approved') is not False or approval.get('approval_state')!='PENDING_EXPLICIT_USER_APPROVAL':
                  raise SystemExit('only an explicitly pending record may be approved')
              approval.update(approved=True, approval_state='EXPLICIT_USER_APPROVED',
                  source_authenticity_verified=True, approved_for_motion=True, approved_for_talking=True,
                  approval_record='github-manual-source-attestation-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT'],
                  authenticity_evidence_type='source_owner_manual_review_attestation',
                  approval_actor=os.environ['GITHUB_ACTOR'])
              path.write_text(json.dumps(approval,indent=2)+'\n')
              print('C004_SOURCE_OWNER_ATTESTATION_RECORDED_PRIVATELY')
          PYCODE
      - name: Require explicit manual approval and build private runtime manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          cand=os.environ['CANDIDATE']; seg=os.environ['SEGMENT']; source=os.environ['SOURCE']
          approval=json.load(open('.c004-final/private/c004_private_approval.json'))
          required={
            'candidate_id':cand,'approved':True,'source_segment_id':seg,
            'source_asset_id':'50380.mp4','source_path':source,
            'segment_start_seconds':0.0,'segment_end_seconds':8.24,
            'source_authenticity_verified':True,'approved_for_motion':True,
            'approved_for_talking':True,'identity_anchor_replacement_allowed':False,
          }
          for k,v in required.items():
              if approval.get(k)!=v: raise SystemExit('manual approval missing or mismatched: '+k)
          if not isinstance(approval.get('approval_record'),str) or not approval['approval_record'].strip():
              raise SystemExit('manual approval record id missing')
          public=json.load(open('content/c004_source_manifest_v1.json'))
          if public.get('candidate_id')!=cand or public['source_selection'].get('source_segment_id')!=seg or public['source_selection'].get('source_path')!=source:
              raise SystemExit('public source selection mismatch')
          runtime=json.loads(json.dumps(public)); runtime['status']='APPROVED_FOR_CPU_QA'
          s=runtime['source_selection']; s['approval_record']=approval['approval_record']; s['source_authenticity_verified']=True; s['approved_for_motion']=True; s['approved_for_talking']=True
          Path('.c004-final/work/runtime_manifest.json').write_text(json.dumps(runtime,indent=2)+'\n')
          Path('.c004-final/work/priors.json').write_text(json.dumps([
            'MASTER_CLONE_GATE_08_15_CANDIDATE_001','MASTER_CLONE_GATE_08_15_CANDIDATE_002','MASTER_CLONE_GATE_08_15_CANDIDATE_003'
          ],indent=2)+'\n')
          print('C004_EXPLICIT_MANUAL_APPROVAL_VERIFIED')
          PY
      - name: Persist explicitly attested approval privately after source validation
        if: ${{ inputs.confirm_reviewed_source == true }}
        shell: bash
        run: |
          set -euo pipefail
          python worker/validate_c004_source.py \
            --manifest .c004-final/work/runtime_manifest.json \
            --approval .c004-final/private/c004_private_approval.json \
            --storage-root .c004-final/private \
            --output .c004-final/work/attested_source.json
          python - <<'PYCODE'
          import json, os
          from pathlib import Path
          Path('.c004-final/private/dataset-metadata.json').write_text(json.dumps({'id':os.environ['KAGGLE_PRIVATE_DATASET'].strip()})+'\n')
          PYCODE
          kaggle datasets version -p .c004-final/private -m 'Record explicit C004 source-owner attestation' --dir-mode zip -q
          echo C004_EXPLICIT_APPROVAL_PERSISTED_PRIVATELY
      - name: Run two complete real-source CPU QA passes
        shell: bash
        run: |
          set -euo pipefail
          cp content/master_clone_package.json .c004-final/work/stable_before.json
          for pass in 1 2; do
            python worker/validate_clone_duplicate.py \
              --candidate ".c004-final/private/${SOURCE}" \
              --prior .c004-final/private/c004_duplicate_priors/C001.mp4 \
              --prior .c004-final/private/c004_duplicate_priors/C002.mp4 \
              --prior .c004-final/private/c004_duplicate_priors/C003.mp4 \
              --policy content/clone_duplicate_gate_v1.json \
              --output ".c004-final/work/private_duplicate_${pass}.json"
            python worker/validate_c004_source.py \
              --manifest .c004-final/work/runtime_manifest.json \
              --approval .c004-final/private/c004_private_approval.json \
              --storage-root .c004-final/private \
              --output ".c004-final/work/source_${pass}.json"
            python worker/run_c004_authorized.py \
              --root . --mydrive .c004-final/private \
              --manifest .c004-final/work/runtime_manifest.json \
              --approval .c004-final/private/c004_private_approval.json \
              --qa .c004-final/work/not-yet-attested.json \
              --prior-inventory .c004-final/work/priors.json \
              --output-dir ".c004-final/out/pass_${pass}" --seconds 8 --preflight-only --source-cpu-only
            test ! -e .c004-final/private/_c004_runtime_only
            test ! -e ".c004-final/out/pass_${pass}/_c004_candidate_root"
          done
          python - <<'PYCODE'
          import json, os, sys
          from pathlib import Path
          from unittest.mock import patch
          sys.path.insert(0, 'worker')
          import run_c004_authorized as runner
          work=Path('.c004-final/work'); storage=Path('.c004-final/private')
          stable=(work/'stable_before.json').read_bytes()
          args=['c004', '--root', '.', '--mydrive', str(storage),
                '--manifest', str(work/'runtime_manifest.json'),
                '--approval', str(storage/'c004_private_approval.json'),
                '--qa', str(work/'not-yet-attested.json'),
                '--prior-inventory', str(work/'priors.json'),
                '--output-dir', '.c004-final/out/recovery', '--seconds', '8',
                '--preflight-only', '--source-cpu-only']
          # Exercise the real cleanup path after media derivation, without GPU execution.
          with patch.object(sys, 'argv', args), patch.object(runner.shutil, 'copytree', side_effect=RuntimeError('C004_CPU_INJECTED_FAILURE')):
              try:
                  runner.main()
              except RuntimeError as exc:
                  if str(exc)!='C004_CPU_INJECTED_FAILURE': raise
              else:
                  raise SystemExit('recovery fault was not exercised')
          if (storage/'_c004_runtime_only').exists() or Path('.c004-final/out/recovery/_c004_candidate_root').exists():
              raise SystemExit('recovery cleanup failed')
          if Path('content/master_clone_package.json').read_bytes()!=stable:
              raise SystemExit('stable package changed')
          cand='MASTER_CLONE_GATE_08_15_CANDIDATE_004'
          manifest=json.loads((work/'runtime_manifest.json').read_text())
          seg=manifest['source_selection']['source_segment_id']
          passes=[]
          for p in (1,2):
              duplicate=json.loads((work/f'private_duplicate_{p}.json').read_text())
              source=json.loads((work/f'source_{p}.json').read_text())
              ready=json.loads(Path(f'.c004-final/out/pass_{p}/C004_RUNTIME_READINESS.json').read_text())
              if duplicate.get('decision')!='UNIQUE_ENOUGH' or len(duplicate.get('comparisons') or [])!=3:
                  raise SystemExit('duplicate gate failed')
              if source.get('decision')!='SOURCE_APPROVED_FOR_CPU_QA' or source.get('candidate_id')!=cand or source.get('source_segment_id')!=seg:
                  raise SystemExit('source gate failed')
              if ready.get('decision')!='C004_CPU_PREPARATION_VERIFIED' or ready.get('candidate_id')!=cand or ready.get('source_segment_id')!=seg:
                  raise SystemExit('preparation evidence mismatch')
              if ready.get('gpu_launch_allowed') is not False or ready.get('stable_clone_modified') is not False or ready.get('fallback_to_c003_allowed') is not False:
                  raise SystemExit('unsafe preparation evidence')
              passes.append({'pass':p,'passed':True,'complete':True})
          priors=json.loads((work/'priors.json').read_text())
          qa={'candidate_id':cand,'source_segment_id':seg,'decision':'CPU_QA_VERIFIED',
              'source_sha':os.environ['GITHUB_SHA'],'cpu_run_id':os.environ['GITHUB_RUN_ID'],
              'passes':passes,
              'duplicate_reports':[{'candidate_id':cand,'source_segment_id':seg,'prior_candidate_id':x,'decision':'UNIQUE_ENOUGH'} for x in priors],
              'release_path_verified':True,'recovery_path_verified':True,
              'runtime_path_scope':'CPU preparation and injected-failure cleanup; GPU output review still required',
              'private_hashes_exported':False}
          (work/'qa_draft.json').write_text(json.dumps(qa,indent=2)+'\n')
          PYCODE
          for pass in 1 2; do
            python worker/c004_runtime_guard.py \
              --manifest .c004-final/work/runtime_manifest.json \
              --approval .c004-final/private/c004_private_approval.json \
              --storage-root .c004-final/private \
              --qa .c004-final/work/qa_draft.json \
              --prior-inventory .c004-final/work/priors.json \
              --output ".c004-final/work/guard_${pass}.json"
            python worker/run_c004_authorized.py \
              --root . --mydrive .c004-final/private \
              --manifest .c004-final/work/runtime_manifest.json \
              --approval .c004-final/private/c004_private_approval.json \
              --qa .c004-final/work/qa_draft.json \
              --prior-inventory .c004-final/work/priors.json \
              --output-dir ".c004-final/out/authorized_${pass}" --seconds 8 --preflight-only
            test ! -e .c004-final/private/_c004_runtime_only
            test ! -e ".c004-final/out/authorized_${pass}/_c004_candidate_root"
            echo "C004_FINAL_CPU_PASS_${pass}_VERIFIED"
          done
          cmp content/master_clone_package.json .c004-final/work/stable_before.json
          cp .c004-final/work/qa_draft.json .c004-final/private/c004_cpu_qa.json
          echo C004_FINAL_TWO_PASS_CPU_QA_VERIFIED
      - name: Persist verified QA privately only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('.c004-final/private/dataset-metadata.json').write_text(json.dumps({'id':os.environ['KAGGLE_PRIVATE_DATASET'].strip()})+'\n')
          PY
          kaggle datasets version -p .c004-final/private -m 'Persist verified C004 two-pass CPU QA' --dir-mode zip -q
          echo C004_PRIVATE_CPU_QA_PERSISTED
      - name: Export sanitized readiness only
        shell: bash
        run: |
          mkdir -p .c004-final/safe
          python - <<'PY'
          import json
          from pathlib import Path
          d={'schema':'zaskaleta-c004-public-cpu-readiness-v1','candidate_id':'MASTER_CLONE_GATE_08_15_CANDIDATE_004','source_segment_id':'50380_face_motion_25_32_5_stretched_8_24','two_complete_cpu_passes':True,'duplicate_gate':'UNIQUE_ENOUGH','runtime_preflight':'VERIFIED','gpu_launch_gate':'READY_AFTER_THIS_QA','auto_promote':False,'stable_release_modified':False,'private_hashes_exported':False}
          Path('.c004-final/safe/C004_CPU_READINESS.json').write_text(json.dumps(d,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: c004-cpu-readiness-safe-${{ github.run_id }}
          path: .c004-final/safe/C004_CPU_READINESS.json
          if-no-files-found: error
          retention-days: 7
      - name: Safety summary
        if: always()
        run: |
          echo 'No GPU starts in this workflow.'
          echo 'Private media, approval, QA internals, and biometric hashes are never exported.'
          echo 'Stable clone remains immutable and promotion remains manual.'
