name: C004 Kaggle GPU Launch
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['C004 Final CPU Preflight']
    types: [completed]
    branches: [main]
concurrency:
  group: c004-kaggle-gpu
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  launch-c004:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_PRIVATE_DATASET: ${{ secrets.KAGGLE_PRIVATE_DATASET }}
      CANDIDATE: MASTER_CLONE_GATE_08_15_CANDIDATE_004
    steps:
      - name: Require successful CPU run on current main and prevent repeated GPU submissions
        env:
          GH_READ_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          def get(path):
              request=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+path,
                  headers={'Authorization':'Bearer '+os.environ['GH_READ_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=30) as response:
                  return json.load(response)
          event=json.load(open(os.environ['GITHUB_EVENT_PATH']))
          head=get('branches/main')['commit']['sha']
          if os.environ['GITHUB_SHA']!=head or os.environ['GITHUB_REF']!='refs/heads/main':
              raise SystemExit('Stale or non-main GPU launch blocked')
          if os.environ['GITHUB_RUN_ATTEMPT']!='1':
              raise SystemExit('GPU workflow retries blocked; inspect existing Kaggle job first')
          runs=get('actions/runs?head_sha='+head+'&per_page=100')['workflow_runs']
          cpu=[r for r in runs if r['path']=='.github/workflows/c004-final-cpu-preflight.yml'
               and r['head_branch']=='main' and r['conclusion']=='success'
               and r.get('head_repository',{}).get('full_name')==repo]
          if os.environ['GITHUB_EVENT_NAME']=='workflow_run':
              cpu=[r for r in cpu if r['id']==event['workflow_run']['id']]
          if not cpu: raise SystemExit('Successful CPU preflight for exact main commit required')
          previous=[r for r in runs if r['path']=='.github/workflows/c004-kaggle-gpu-launch.yml'
                    and str(r['id'])!=os.environ['GITHUB_RUN_ID'] and int(r['id'])<int(os.environ['GITHUB_RUN_ID'])]
          if previous: raise SystemExit('Prior GPU workflow exists for this commit; inspect it before any resubmission')
          with open(os.environ['GITHUB_ENV'],'a') as out:
              out.write('VERIFIED_CPU_RUN_ID='+str(cpu[0]['id'])+'\n')
          print('C004_EXACT_COMMIT_CPU_SUCCESS_VERIFIED')
          PYCODE
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kaggle client
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"; test -n "$KAGGLE_USERNAME"; test -n "$KAGGLE_PRIVATE_DATASET"
          python -m pip install --quiet 'kaggle>=1.8.0'
      - name: Fail closed unless private manual approval and final CPU QA are present
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .c004-launch-private && mkdir -p .c004-launch-private
          kaggle datasets download -d "$KAGGLE_PRIVATE_DATASET" -p .c004-launch-private --unzip -q
          test -f .c004-launch-private/c004_private_approval.json
          test -f .c004-launch-private/c004_cpu_qa.json
          test -f .c004-launch-private/C004_SOURCE_50380_FACE_MOTION_8_25_CROPPED.mp4
          python - <<'PY'
          import json, os
          a=json.load(open('.c004-launch-private/c004_private_approval.json'))
          q=json.load(open('.c004-launch-private/c004_cpu_qa.json'))
          cand='MASTER_CLONE_GATE_08_15_CANDIDATE_004'; seg='50380_face_motion_25_32_5_stretched_8_24'
          if a.get('candidate_id')!=cand or a.get('approved') is not True or a.get('source_segment_id')!=seg:
              raise SystemExit('C004 explicit manual approval is not present')
          if a.get('source_authenticity_verified') is not True or a.get('approved_for_motion') is not True or a.get('approved_for_talking') is not True or a.get('identity_anchor_replacement_allowed') is not False:
              raise SystemExit('C004 approval scope mismatch')
          if q.get('candidate_id')!=cand or q.get('source_segment_id')!=seg or q.get('decision')!='CPU_QA_VERIFIED':
              raise SystemExit('C004 final CPU QA missing')
          if q.get('source_sha')!=os.environ['GITHUB_SHA'] or str(q.get('cpu_run_id'))!=os.environ['VERIFIED_CPU_RUN_ID']:
              raise SystemExit('Private QA is not bound to the successful CPU run and exact source commit')
          passes=q.get('passes') or []
          if len(passes)!=2 or not all(p.get('passed') is True and p.get('complete') is True for p in passes):
              raise SystemExit('C004 two complete CPU passes missing')
          if q.get('release_path_verified') is not True or q.get('recovery_path_verified') is not True:
              raise SystemExit('C004 runtime path verification missing')
          reports=q.get('duplicate_reports') or []
          if len(reports)!=3 or any(r.get('decision')!='UNIQUE_ENOUGH' for r in reports):
              raise SystemExit('C004 duplicate gate not fully verified')
          print('C004_GPU_PRELAUNCH_PRIVATE_GATES_VERIFIED')
          PY
          rm -rf .c004-launch-private
      - name: Build immutable C004 Kaggle source bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .kaggle-c004 && mkdir -p .kaggle-c004
          git archive --format=zip HEAD -o .kaggle-c004/source_bundle.zip
          cp kaggle/verified_c004_entry.py .kaggle-c004/verified_c004_entry.py
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          root=Path('.')
          def sha(p):
              h=hashlib.sha256()
              with Path(p).open('rb') as f:
                  for c in iter(lambda:f.read(1024*1024),b''): h.update(c)
              return h.hexdigest()
          source_sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          critical=[
            'content/c004_source_manifest_v1.json',
            'content/clone_duplicate_gate_v1.json',
            'worker/validate_c004_source.py',
            'worker/c004_runtime_guard.py',
            'worker/run_c004_authorized.py',
            'worker/run_clone_v2_test.py',
            'kaggle/autopilot_kernel_c004.py',
          ]
          identity={
            'schema':'zaskaleta-c004-run-identity-v1',
            'run_token':os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT'],
            'source_sha':source_sha,
            'candidate_id':os.environ['CANDIDATE'],
            'bundle_sha256':sha('.kaggle-c004/source_bundle.zip'),
            'critical_source_hashes':{p:sha(p) for p in critical},
            'auto_promote':False,
            'stable_release_modified':False,
          }
          Path('.kaggle-c004/run_identity.json').write_text(json.dumps(identity,indent=2)+'\n')
          meta={
            'id':f"{os.environ['KAGGLE_USERNAME']}/zaskaleta-c004-{os.environ['GITHUB_RUN_ID']}",
            'title':f"Zaskaleta MASTER CLONE C004 {os.environ['GITHUB_RUN_ID']}",
            'code_file':'verified_c004_entry.py',
            'language':'python','kernel_type':'script','is_private':True,
            'enable_gpu':True,'enable_internet':True,
            'dataset_sources':[os.environ['KAGGLE_PRIVATE_DATASET'].strip()],
            'competition_sources':[],'kernel_sources':[]
          }
          Path('.kaggle-c004/kernel-metadata.json').write_text(json.dumps(meta,indent=2)+'\n')
          print('C004_IMMUTABLE_GPU_BUNDLE_READY')
          PY
      - name: Launch C004 on free Kaggle GPU
        shell: bash
        run: |
          set -euo pipefail
          KERNEL="${KAGGLE_USERNAME}/zaskaleta-c004-${GITHUB_RUN_ID}"
          echo "C004_GPU_KERNEL=${KERNEL}"
          kaggle kernels push -p .kaggle-c004 --timeout 7200 --accelerator gpu
          echo C004_GPU_LAUNCH_SUBMITTED
      - name: Follow C004 render to terminal status
        shell: bash
        run: |
          set -euo pipefail
          KERNEL="${KAGGLE_USERNAME}/zaskaleta-c004-${GITHUB_RUN_ID}"
          timeout 6600 kaggle kernels logs "$KERNEL" --follow --interval 15 > /tmp/c004-private-kernel.log 2>&1 || rc=$?
          rc=${rc:-0}
          [ "$rc" -ne 124 ] || { echo 'C004 Kaggle render timed out'; exit 1; }
          status_out="$(kaggle kernels status "$KERNEL" 2>&1 || true)"
          echo "$status_out"
          ! echo "$status_out" | grep -Eq 'ERROR|CANCEL|FAILED'
      - name: Download generated C004 review output only
        shell: bash
        run: |
          set -euo pipefail
          KERNEL="${KAGGLE_USERNAME}/zaskaleta-c004-${GITHUB_RUN_ID}"
          rm -rf .c004-review && mkdir -p .c004-review
          for attempt in $(seq 1 18); do
            rm -rf .c004-review/*
            kaggle kernels output "$KERNEL" -p .c004-review \
              --file-pattern '(^|/)zaskaleta_c004_status\.json$|(^|/)CLONE_V2_TALKING_TEST\.mp4$' -q || true
            VIDEO="$(find .c004-review -type f -name 'CLONE_V2_TALKING_TEST.mp4' -print -quit)"
            STATUS="$(find .c004-review -type f -name 'zaskaleta_c004_status.json' -print -quit)"
            if [ -n "$VIDEO" ] && [ -n "$STATUS" ]; then break; fi
            sleep 10
          done
          test -n "${VIDEO:-}"; test -n "${STATUS:-}"
          python - "$STATUS" <<'PY'
          import json,sys,os
          d=json.load(open(sys.argv[1]))
          assert d.get('source_sha')==os.environ['GITHUB_SHA']
          assert d.get('run_token')==os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']
          assert d.get('candidate_id')=='MASTER_CLONE_GATE_08_15_CANDIDATE_004'
          assert d.get('state')=='C004_RENDER_READY_FOR_MANUAL_REVIEW'
          assert d.get('render_completed') is True
          assert d.get('auto_promote') is False and d.get('stable_release_modified') is False
          assert d.get('subjective_identity_review')=='PENDING_MANUAL_REVIEW'
          print('C004_RENDER_OUTPUT_VERIFIED_FOR_MANUAL_REVIEW')
          PY
          mkdir -p .c004-export
          cp "$VIDEO" .c004-export/MASTER_CLONE_GATE_08_15_CANDIDATE_004.mp4
          cp "$STATUS" .c004-export/C004_SAFE_STATUS.json
      - name: Upload generated C004 candidate for manual review
        uses: actions/upload-artifact@v4
        with:
          name: master-clone-c004-review-${{ github.run_id }}
          path: .c004-export/
          if-no-files-found: error
          retention-days: 7
      - name: Safety summary
        if: always()
        run: |
          echo 'This workflow uses Kaggle GPU only; it does not provision paid GPU infrastructure.'
          echo 'GPU submission is impossible without explicit private manual approval and verified two-pass CPU QA.'
          echo 'Raw private source media and biometric hashes are not exported to GitHub.'
          echo 'C004 remains quarantined for manual output review; stable release is never overwritten or auto-promoted.'
