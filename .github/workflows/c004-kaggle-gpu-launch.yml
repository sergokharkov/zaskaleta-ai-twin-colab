# C004 GPU launch is temporarily manual-only while recovering the already completed GPU #14 output.
# This prevents an unnecessary duplicate GPU submission during Kaggle 429 recovery.
name: C004 Kaggle GPU Launch
on:
  workflow_dispatch:
concurrency:
  group: c004-kaggle-gpu
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  launch-c004:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_PRIVATE_DATASET: ${{ secrets.KAGGLE_PRIVATE_DATASET }}
      CANDIDATE: MASTER_CLONE_GATE_08_15_CANDIDATE_004
    steps:
      - name: Require successful CPU run on current main and prevent repeated GPU submissions
        env:
          GH_READ_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          def get(path):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+path,
                  headers={'Authorization':'Bearer '+os.environ['GH_READ_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  return json.load(r)
          head=get('branches/main')['commit']['sha']
          if os.environ['GITHUB_SHA']!=head or os.environ['GITHUB_REF']!='refs/heads/main':
              raise SystemExit('Stale or non-main GPU launch blocked')
          if os.environ['GITHUB_RUN_ATTEMPT']!='1':
              raise SystemExit('GPU workflow retries blocked; inspect existing Kaggle job first')
          runs=get('actions/runs?head_sha='+head+'&per_page=100')['workflow_runs']
          cpu=[r for r in runs if r['path']=='.github/workflows/c004-final-cpu-preflight.yml'
               and r['head_branch']=='main' and r['conclusion']=='success'
               and r.get('head_repository',{}).get('full_name')==repo]
          if not cpu:
              raise SystemExit('Successful CPU preflight for exact main commit required')
          cpu_id=str(cpu[0]['id'])
          previous=[r for r in runs if r['path']=='.github/workflows/c004-kaggle-gpu-launch.yml'
                    and str(r['id'])!=os.environ['GITHUB_RUN_ID'] and int(r['id'])<int(os.environ['GITHUB_RUN_ID'])]
          for prior in previous:
              jobs=get('actions/runs/'+str(prior['id'])+'/jobs?per_page=100').get('jobs') or []
              attempted=any(step.get('name')=='Launch C004 on free Kaggle GPU' and step.get('conclusion') not in (None,'skipped')
                            for job in jobs for step in (job.get('steps') or []))
              if attempted:
                  raise SystemExit('Prior GPU submission step already attempted for this commit; inspect Kaggle job first')
          with open(os.environ['GITHUB_ENV'],'a') as out:
              out.write('VERIFIED_CPU_RUN_ID='+cpu_id+'\n')
          print('C004_EXACT_COMMIT_CPU_SUCCESS_VERIFIED')
          PYCODE
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kaggle client
        run: python -m pip install --quiet 'kaggle>=1.8.0'
      - name: Fail closed unless private manual approval and final CPU QA are present
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .c004-launch-private && mkdir -p .c004-launch-private
          kaggle datasets download -d "$KAGGLE_PRIVATE_DATASET" -p .c004-launch-private --unzip -q
          test -f .c004-launch-private/c004_private_approval.json
          test -f .c004-launch-private/c004_cpu_qa.json
          python - <<'PY'
          import json, os
          a=json.load(open('.c004-launch-private/c004_private_approval.json'))
          q=json.load(open('.c004-launch-private/c004_cpu_qa.json'))
          assert a.get('candidate_id')==os.environ['CANDIDATE'] and a.get('approved') is True
          assert q.get('candidate_id')==os.environ['CANDIDATE'] and q.get('decision')=='CPU_QA_VERIFIED'
          assert q.get('source_sha')==os.environ['GITHUB_SHA']
          assert str(q.get('cpu_run_id'))==os.environ['VERIFIED_CPU_RUN_ID']
          assert len(q.get('passes') or [])==2 and all(p.get('passed') is True and p.get('complete') is True for p in q['passes'])
          print('C004_GPU_PRELAUNCH_PRIVATE_GATES_VERIFIED')
          PY
          rm -rf .c004-launch-private
      - name: Build immutable C004 Kaggle source bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .kaggle-c004 && mkdir -p .kaggle-c004
          git archive --format=zip HEAD -o .kaggle-c004/source_bundle.zip
          cp kaggle/verified_c004_entry.py .kaggle-c004/verified_c004_entry.py
          python - <<'PY'
          import base64, hashlib, json, os, subprocess
          from pathlib import Path
          def sha(p):
              h=hashlib.sha256()
              with Path(p).open('rb') as f:
                  for c in iter(lambda:f.read(1024*1024),b''): h.update(c)
              return h.hexdigest()
          source_sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          critical=['content/c004_source_manifest_v1.json','content/clone_duplicate_gate_v1.json','worker/validate_c004_source.py','worker/c004_runtime_guard.py','worker/run_c004_authorized.py','worker/run_clone_v2_test.py','worker/generate_scene_speech.py','kaggle/bootstrap.py','kaggle/autopilot_kernel_c004.py']
          identity={'schema':'zaskaleta-c004-run-identity-v1','run_token':os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT'],'source_sha':source_sha,'candidate_id':os.environ['CANDIDATE'],'bundle_sha256':sha('.kaggle-c004/source_bundle.zip'),'critical_source_hashes':{p:sha(p) for p in critical},'auto_promote':False,'stable_release_modified':False}
          Path('.kaggle-c004/run_identity.json').write_text(json.dumps(identity,indent=2)+'\n')
          entry=Path('kaggle/verified_c004_entry.py').read_text(); bundle_b64=base64.b64encode(Path('.kaggle-c004/source_bundle.zip').read_bytes()).decode('ascii')
          boot=['import base64, json, runpy','from pathlib import Path',"p=Path('/kaggle/working/_c004_bootstrap')",'p.mkdir(parents=True, exist_ok=False)',"(p/'source_bundle.zip').write_bytes(base64.b64decode("+repr(bundle_b64)+"))","(p/'run_identity.json').write_text("+repr(json.dumps(identity))+", encoding='utf-8')","(p/'verified_c004_entry.py').write_text("+repr(entry)+", encoding='utf-8')","runpy.run_path(str(p/'verified_c004_entry.py'), run_name='__main__')"]
          Path('.kaggle-c004/verified_c004_entry.py').write_text('\n'.join(boot)+'\n')
          slug=f"zaskaleta-c004-{os.environ['GITHUB_RUN_ID']}"; meta={'id':f"{os.environ['KAGGLE_USERNAME']}/{slug}",'title':slug,'code_file':'verified_c004_entry.py','language':'python','kernel_type':'script','is_private':True,'enable_gpu':True,'enable_internet':True,'dataset_sources':[os.environ['KAGGLE_PRIVATE_DATASET'].strip()],'competition_sources':[],'kernel_sources':[]}
          Path('.kaggle-c004/kernel-metadata.json').write_text(json.dumps(meta,indent=2)+'\n')
          PY
      - name: Launch C004 on free Kaggle GPU
        run: kaggle kernels push -p .kaggle-c004 --timeout 7200 --accelerator NvidiaTeslaT4
      - name: Follow C004 render to terminal status
        shell: bash
        run: |
          set -euo pipefail
          KERNEL="${KAGGLE_USERNAME}/zaskaleta-c004-${GITHUB_RUN_ID}"
          deadline=$(( $(date +%s) + 6600 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            s="$(kaggle kernels status "$KERNEL" 2>&1 || true)"; echo "$s"
            echo "$s" | grep -Eqi 'COMPLETE|COMPLETED' && exit 0
            echo "$s" | grep -Eqi 'ERROR|CANCELLED|CANCELED|FAILED' && exit 1
            sleep 20
          done
          exit 1
      - name: Download generated C004 review output only
        shell: bash
        run: |
          set -euo pipefail
          KERNEL="${KAGGLE_USERNAME}/zaskaleta-c004-${GITHUB_RUN_ID}"
          rm -rf .c004-review && mkdir -p .c004-review
          kaggle kernels output "$KERNEL" -p .c004-review -q
          VIDEO="$(find .c004-review -type f -name 'CLONE_V2_TALKING_TEST.mp4' -print -quit)"
          STATUS="$(find .c004-review -type f -name 'zaskaleta_c004_status.json' -print -quit)"
          test -n "$VIDEO"; test -n "$STATUS"
          python - "$STATUS" <<'PY'
          import json,sys,os
          d=json.load(open(sys.argv[1])); assert d.get('source_sha')==os.environ['GITHUB_SHA']; assert d.get('run_token')==os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']; assert d.get('candidate_id')==os.environ['CANDIDATE']; assert d.get('state')=='C004_RENDER_READY_FOR_MANUAL_REVIEW'; assert d.get('render_completed') is True; assert d.get('auto_promote') is False and d.get('stable_release_modified') is False
          PY
          mkdir -p .c004-export; cp "$VIDEO" .c004-export/MASTER_CLONE_GATE_08_15_CANDIDATE_004.mp4; cp "$STATUS" .c004-export/C004_SAFE_STATUS.json
      - uses: actions/upload-artifact@v4
        with:
          name: master-clone-c004-review-${{ github.run_id }}
          path: .c004-export/
          retention-days: 7
