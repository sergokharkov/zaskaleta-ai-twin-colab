name: C004 Kaggle Output Recovery
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/c004-kaggle-output-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover-existing-c004:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      SOURCE_SHA: 5f904215c1c85b4908ed633486f8f408c8062ad5
      SOURCE_RUN_ID: '34152184760'
      SOURCE_RUN_TOKEN: '34152184760-1'
      CANDIDATE: MASTER_CLONE_GATE_08_15_CANDIDATE_004
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kaggle client
        run: python -m pip install --quiet 'kaggle>=1.8.0'
      - name: Recover completed C004 output without new GPU submission
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"; test -n "$KAGGLE_USERNAME"
          KERNEL="${KAGGLE_USERNAME}/zaskaleta-c004-${SOURCE_RUN_ID}"
          status_out="$(kaggle kernels status "$KERNEL" 2>&1 || true)"
          echo "$status_out"
          echo "$status_out" | grep -Eqi 'COMPLETE|COMPLETED' || { echo 'Existing C004 kernel is not complete'; exit 1; }
          rm -rf .c004-recovery && mkdir -p .c004-recovery
          success=false
          for attempt in $(seq 1 20); do
            rm -rf .c004-recovery/*
            echo "C004_OUTPUT_RECOVERY_ATTEMPT=${attempt}"
            if kaggle kernels output "$KERNEL" -p .c004-recovery -q; then
              VIDEO="$(find .c004-recovery -type f -name 'CLONE_V2_TALKING_TEST.mp4' -print -quit)"
              STATUS="$(find .c004-recovery -type f -name 'zaskaleta_c004_status.json' -print -quit)"
              if [ -n "$VIDEO" ] && [ -n "$STATUS" ]; then success=true; break; fi
            fi
            sleep $(( attempt < 5 ? 30 : 60 ))
          done
          [ "$success" = true ] || { echo 'Existing C004 output remained unavailable'; exit 1; }
          python - "$STATUS" <<'PY'
          import json, os, sys
          d=json.load(open(sys.argv[1]))
          assert d.get('source_sha')==os.environ['SOURCE_SHA']
          assert d.get('run_token')==os.environ['SOURCE_RUN_TOKEN']
          assert d.get('candidate_id')==os.environ['CANDIDATE']
          assert d.get('state')=='C004_RENDER_READY_FOR_MANUAL_REVIEW'
          assert d.get('render_completed') is True
          assert d.get('auto_promote') is False
          assert d.get('stable_release_modified') is False
          print('C004_EXISTING_RENDER_PROVENANCE_VERIFIED')
          PY
          mkdir -p .c004-export
          cp "$VIDEO" .c004-export/MASTER_CLONE_GATE_08_15_CANDIDATE_004.mp4
          cp "$STATUS" .c004-export/C004_SAFE_STATUS.json
      - name: Upload recovered C004 candidate
        uses: actions/upload-artifact@v4
        with:
          name: master-clone-c004-recovered-${{ github.run_id }}
          path: .c004-export/
          if-no-files-found: error
          retention-days: 7
      - name: Safety summary
        if: always()
        run: |
          echo 'Recovery only: no Kaggle kernel push and no GPU submission occur in this workflow.'
          echo 'Stable clone remains unchanged; candidate is exported only for manual review.'
