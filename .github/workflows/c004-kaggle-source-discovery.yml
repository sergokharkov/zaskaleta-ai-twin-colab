name: C004 Kaggle Source Discovery
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-clone-dataset-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ai-clone-isolated
    env:
      KAGGLE_API_TOKEN: ${{ secrets.AI_CLONE_KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.AI_CLONE_KAGGLE_USERNAME }}
      AI_CLONE_KAGGLE_DATASET: ${{ vars.AI_CLONE_KAGGLE_DATASET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect only the explicitly scoped AI Clone dataset
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN"
          test -n "$KAGGLE_USERNAME"
          test -n "$AI_CLONE_KAGGLE_DATASET"
          case "$AI_CLONE_KAGGLE_DATASET" in "$KAGGLE_USERNAME"/*) ;; *) echo 'Dataset owner mismatch'; exit 41;; esac
          python -m pip install --quiet 'kaggle>=1.8.0'
          python - <<'PY'
          import os
          from pathlib import PurePosixPath
          from kaggle.api.kaggle_api_extended import KaggleApi
          api=KaggleApi(); api.authenticate()
          ref=os.environ['AI_CLONE_KAGGLE_DATASET']
          wanted={'50380.mp4','50280.mp4','50280(1).mp4','53693.mp4','53693(1).mp4','48025.mp4'}
          files=api.dataset_list_files(ref).files or []
          bases={PurePosixPath(getattr(f,'name','')).name for f in files}
          matched=sorted(wanted & bases)
          print('AI_CLONE_KAGGLE_SCOPE_OK')
          print('C004_CANDIDATE_COUNT=' + str(len(matched)))
          if not matched:
              raise SystemExit('No C004 source candidate in explicitly scoped AI Clone dataset')
          PY
      - name: Safety summary
        if: always()
        run: echo 'Single-dataset metadata inspection only; account-wide enumeration is prohibited.'
