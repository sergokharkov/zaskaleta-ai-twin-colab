name: C005 YuNet Multi-Face Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/c005-yunet-multiface-diagnostic.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/download-artifact@v4
        with:
          name: c005-targeted-recovery-34382337207
          path: recovered
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34382337207

      - name: Install verified YuNet and SFace models
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet opencv-contrib-python-headless==4.10.0.84 numpy
          mkdir -p models
          curl -fL --retry 4 --retry-delay 3 'https://media.githubusercontent.com/media/opencv/opencv_zoo/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx' -o models/yunet.onnx
          curl -fL --retry 4 --retry-delay 3 'https://media.githubusercontent.com/media/opencv/opencv_zoo/main/models/face_recognition_sface/face_recognition_sface_2021dec.onnx' -o models/sface.onnx
          test "$(stat -c%s models/yunet.onnx)" -gt 100000
          test "$(stat -c%s models/sface.onnx)" -gt 1000000

      - name: Scan every recovered C005 frame for persistent multi-face evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import cv2, json, math
          import numpy as np
          from pathlib import Path

          video=list(Path('recovered').rglob('CLONE_V2_TALKING_TEST.mp4'))[0]
          rec=cv2.FaceRecognizerSF.create('models/sface.onnx','')
          cap=cv2.VideoCapture(str(video))
          if not cap.isOpened(): raise SystemExit('video open failed')
          frame_count=int(cap.get(cv2.CAP_PROP_FRAME_COUNT))
          if frame_count <= 0: raise SystemExit('invalid frame count')

          def read_frame(idx):
              cap.set(cv2.CAP_PROP_POS_FRAMES,idx)
              ok,fr=cap.read()
              if not ok or fr is None: raise SystemExit(f'cannot read frame {idx}')
              return fr

          def detect(frame,thr=0.70):
              h,w=frame.shape[:2]
              det=cv2.FaceDetectorYN.create('models/yunet.onnx','',(w,h),thr,0.3,5000)
              _,faces=det.detect(frame)
              return [] if faces is None else [np.asarray(f,dtype=np.float32) for f in faces]

          def box(f):
              x,y,bw,bh=map(float,f[:4]); return (x,y,x+bw,y+bh)
          def area(b): return max(0,b[2]-b[0])*max(0,b[3]-b[1])
          def inter(a,b):
              return max(0,min(a[2],b[2])-max(a[0],b[0]))*max(0,min(a[3],b[3])-max(a[1],b[1]))
          def pair_metrics(f1,f2,w,h):
              b1,b2=box(f1),box(f2); a1,a2=area(b1),area(b2); ia=inter(b1,b2)
              iou=ia/(a1+a2-ia) if a1+a2-ia else 0.0
              contain=ia/min(a1,a2) if min(a1,a2) else 0.0
              c1=((b1[0]+b1[2])/2,(b1[1]+b1[3])/2); c2=((b2[0]+b2[2])/2,(b2[1]+b2[3])/2)
              return iou,contain,math.dist(c1,c2)/math.hypot(w,h)

          anchor_frame=read_frame(0)
          af=detect(anchor_frame)
          if not af: raise SystemExit('anchor missing')
          anchor=max(af,key=lambda f:float(f[2]*f[3]))
          anchor_emb=rec.feature(rec.alignCrop(anchor_frame,anchor))

          multi_frames=[]; distinct_like_frames=[]; no_face_frames=[]; summary_rows=[]
          for idx in range(frame_count):
              fr=read_frame(idx); h,w=fr.shape[:2]
              fs=sorted(detect(fr),key=lambda f:float(f[2]*f[3]),reverse=True)
              if not fs:
                  no_face_frames.append(idx)
                  continue
              row={'frame':idx,'raw_detection_count':len(fs)}
              if len(fs)>=2:
                  multi_frames.append(idx)
                  iou,contain,cd=pair_metrics(fs[0],fs[1],w,h)
                  row['top2_pair_metrics']={
                    'iou':round(iou,6),
                    'intersection_over_smaller_box':round(contain,6),
                    'normalized_center_distance':round(cd,6)
                  }
                  row['top2_sface_anchor_cosine']=[]
                  for f in fs[:2]:
                      emb=rec.feature(rec.alignCrop(fr,f))
                      row['top2_sface_anchor_cosine'].append(round(float(rec.match(anchor_emb,emb,cv2.FaceRecognizerSF_FR_COSINE)),6))
                  # Conservative spatial evidence only: no deduplication and no gate weakening.
                  if iou < 0.35 and contain < 0.70 and cd > 0.05:
                      distinct_like_frames.append(idx)
                  summary_rows.append(row)

          cap.release()

          def longest_run(vals):
              best=cur=0; prev=None
              for idx in vals:
                  cur=cur+1 if prev is not None and idx==prev+1 else 1
                  best=max(best,cur); prev=idx
              return best

          longest_multi=longest_run(multi_frames)
          longest_distinct=longest_run(distinct_like_frames)
          persistent=longest_distinct>=3

          out={
            'schema':'zaskaleta-c005-yunet-temporal-multiface-diagnostic-v2',
            'source_recovery_run_id':'34382337207',
            'frame_range':[0,frame_count-1],
            'frame_count':frame_count,
            'yunet_score_threshold':0.70,
            'sface_temporal_threshold_reference':0.40,
            'required_single_face_policy':True,
            'gate_pass_ratio_unchanged':0.89,
            'stable_release_modified':False,
            'new_gpu_launched':False,
            'multi_detection_frames':multi_frames,
            'multi_detection_frame_count':len(multi_frames),
            'longest_consecutive_multi_detection_run':longest_multi,
            'spatially_distinct_like_frames':distinct_like_frames,
            'spatially_distinct_like_frame_count':len(distinct_like_frames),
            'longest_consecutive_spatially_distinct_like_run':longest_distinct,
            'no_face_frames':no_face_frames,
            'no_face_frame_count':len(no_face_frames),
            'decision':'PERSISTENT_MULTIFACE_EVIDENCE' if persistent else ('TRANSIENT_OR_AMBIGUOUS' if multi_frames else 'SINGLE_FACE_ONLY'),
            'multi_detection_details':summary_rows
          }
          Path('C005_YUNET_MULTIFACE_DIAG.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: c005-yunet-multiface-diag-${{ github.run_id }}
          path: C005_YUNET_MULTIFACE_DIAG.json
          if-no-files-found: error
          retention-days: 7

      - name: Safety summary
        if: always()
        run: |
          echo 'Diagnostic only. No GPU launched.'
          echo 'No deduplication applied.'
          echo 'Single-face policy remains required.'
          echo 'Required pass ratio remains 0.89.'
          echo 'Stable release unchanged.'
