name: C005 YuNet Multi-Face Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/c005-yunet-multiface-diagnostic.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/download-artifact@v4
        with:
          name: c005-targeted-recovery-34382337207
          path: recovered
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34382337207

      - name: Install verified models
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet opencv-contrib-python-headless==4.10.0.84 numpy
          mkdir -p models
          curl -fL --retry 4 --retry-delay 3 'https://media.githubusercontent.com/media/opencv/opencv_zoo/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx' -o models/yunet.onnx
          curl -fL --retry 4 --retry-delay 3 'https://media.githubusercontent.com/media/opencv/opencv_zoo/main/models/face_recognition_sface/face_recognition_sface_2021dec.onnx' -o models/sface.onnx
          test "$(stat -c%s models/yunet.onnx)" -gt 100000
          test "$(stat -c%s models/sface.onnx)" -gt 1000000

      - name: Inspect every YuNet detection at frame 50
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import cv2, json
          import numpy as np
          from pathlib import Path

          video=list(Path('recovered').rglob('CLONE_V2_TALKING_TEST.mp4'))[0]
          rec=cv2.FaceRecognizerSF.create('models/sface.onnx','')
          cap=cv2.VideoCapture(str(video))
          frames={}
          for idx in [0,50]:
              cap.set(cv2.CAP_PROP_POS_FRAMES,idx)
              ok,fr=cap.read()
              if not ok: raise SystemExit(f'cannot read frame {idx}')
              frames[idx]=fr
          cap.release()

          def detect(frame,thr):
              h,w=frame.shape[:2]
              det=cv2.FaceDetectorYN.create('models/yunet.onnx','',(w,h),thr,0.3,5000)
              _,faces=det.detect(frame)
              return [] if faces is None else [np.asarray(f,dtype=np.float32) for f in faces]

          anchors=detect(frames[0],0.70)
          if not anchors: raise SystemExit('anchor missing')
          anchor=max(anchors,key=lambda f:float(f[2]*f[3]))
          anchor_emb=rec.feature(rec.alignCrop(frames[0],anchor))

          out={
            'schema':'zaskaleta-c005-yunet-multiface-diagnostic-v1',
            'source_recovery_run_id':'34382337207',
            'frame':50,
            'yunet_score_threshold':0.70,
            'required_single_face_policy':True,
            'gate_pass_ratio_unchanged':0.89,
            'stable_release_modified':False,
            'new_gpu_launched':False,
            'detections':[]
          }
          fs=detect(frames[50],0.70)
          h,w=frames[50].shape[:2]
          for i,f in enumerate(sorted(fs,key=lambda x:float(x[2]*x[3]),reverse=True)):
              x,y,bw,bh=map(float,f[:4])
              area=float(bw*bh)/(w*h)
              emb=rec.feature(rec.alignCrop(frames[50],f))
              cosine=float(rec.match(anchor_emb,emb,cv2.FaceRecognizerSF_FR_COSINE))
              out['detections'].append({
                'rank_by_area':i+1,
                'detector_score':round(float(f[-1]),6),
                'area_ratio':round(area,6),
                'center':[round((x+bw/2)/w,6),round((y+bh/2)/h,6)],
                'sface_anchor_cosine':round(cosine,6)
              })
          out['detected_face_count']=len(fs)
          Path('C005_YUNET_MULTIFACE_DIAG.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: c005-yunet-multiface-diag-${{ github.run_id }}
          path: C005_YUNET_MULTIFACE_DIAG.json
          if-no-files-found: error
          retention-days: 7

      - name: Safety summary
        if: always()
        run: |
          echo 'Diagnostic only. No GPU launched.'
          echo 'Single-face policy remains required.'
          echo 'Stable release unchanged.'
