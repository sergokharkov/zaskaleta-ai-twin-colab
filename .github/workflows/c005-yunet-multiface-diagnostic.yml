name: C005 YuNet Multi-Face Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/c005-yunet-multiface-diagnostic.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/download-artifact@v4
        with:
          name: c005-targeted-recovery-34382337207
          path: recovered
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34382337207

      - name: Install verified YuNet model
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet opencv-contrib-python-headless==4.10.0.84 numpy
          mkdir -p models
          curl -fL --retry 4 --retry-delay 3 'https://media.githubusercontent.com/media/opencv/opencv_zoo/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx' -o models/yunet.onnx
          test "$(stat -c%s models/yunet.onnx)" -gt 100000

      - name: Measure overlap and landmark geometry at frame 50
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import cv2, json, math
          import numpy as np
          from pathlib import Path

          video=list(Path('recovered').rglob('CLONE_V2_TALKING_TEST.mp4'))[0]
          cap=cv2.VideoCapture(str(video)); cap.set(cv2.CAP_PROP_POS_FRAMES,50)
          ok,frame=cap.read(); cap.release()
          if not ok: raise SystemExit('cannot read frame 50')
          h,w=frame.shape[:2]
          det=cv2.FaceDetectorYN.create('models/yunet.onnx','',(w,h),0.70,0.3,5000)
          _,faces=det.detect(frame)
          fs=[] if faces is None else [np.asarray(f,dtype=np.float32) for f in faces]
          if len(fs)!=2: raise SystemExit(f'expected 2 raw detections, got {len(fs)}')

          def box(f):
              x,y,bw,bh=map(float,f[:4]); return (x,y,x+bw,y+bh)
          def ar(b): return max(0,b[2]-b[0])*max(0,b[3]-b[1])
          def inter(a,b):
              return max(0,min(a[2],b[2])-max(a[0],b[0]))*max(0,min(a[3],b[3])-max(a[1],b[1]))
          def pts(f):
              v=list(map(float,f[4:14])); return [(v[i],v[i+1]) for i in range(0,10,2)]

          b1,b2=box(fs[0]),box(fs[1]); a1,a2=ar(b1),ar(b2); ia=inter(b1,b2)
          iou=ia/(a1+a2-ia) if a1+a2-ia else 0.0
          contain=ia/min(a1,a2) if min(a1,a2) else 0.0
          c1=((b1[0]+b1[2])/2,(b1[1]+b1[3])/2); c2=((b2[0]+b2[2])/2,(b2[1]+b2[3])/2)
          center_dist=math.dist(c1,c2)/math.hypot(w,h)
          p1,p2=pts(fs[0]),pts(fs[1])
          d1=math.hypot(b1[2]-b1[0],b1[3]-b1[1]); d2=math.hypot(b2[2]-b2[0],b2[3]-b2[1]); norm=max((d1+d2)/2,1)
          lm=[math.dist(a,b)/norm for a,b in zip(p1,p2)]
          duplicate_like=bool((iou>=0.35 or contain>=0.70) and sum(lm)/len(lm)<=0.18 and max(lm)<=0.30)

          out={
            'schema':'zaskaleta-c005-yunet-multiface-diagnostic-v2',
            'source_recovery_run_id':'34382337207','frame':50,'yunet_score_threshold':0.70,
            'required_single_face_policy':True,'gate_pass_ratio_unchanged':0.89,
            'stable_release_modified':False,'new_gpu_launched':False,
            'raw_detection_count':2,
            'pair_metrics':{
              'iou':round(iou,6),'intersection_over_smaller_box':round(contain,6),
              'normalized_center_distance':round(center_dist,6),
              'normalized_landmark_mean_distance':round(sum(lm)/len(lm),6),
              'normalized_landmark_max_distance':round(max(lm),6)},
            'duplicate_like_same_object_hypothesis':duplicate_like,
            'decision':'DUPLICATE_LIKE' if duplicate_like else 'AMBIGUOUS_OR_DISTINCT'
          }
          Path('C005_YUNET_MULTIFACE_DIAG.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: c005-yunet-multiface-diag-${{ github.run_id }}
          path: C005_YUNET_MULTIFACE_DIAG.json
          if-no-files-found: error
          retention-days: 7

      - name: Safety summary
        if: always()
        run: |
          echo 'Diagnostic only. No GPU launched.'
          echo 'Single-face policy remains required.'
          echo 'Required pass ratio remains 0.89.'
          echo 'Stable release unchanged.'
