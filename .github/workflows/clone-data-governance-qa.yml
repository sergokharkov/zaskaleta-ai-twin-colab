name: Clone Data Governance QA

on:
  push:
    branches: [main]
    paths:
      - 'content/clone_memory_policy_v1.json'
      - 'content/clone_memory_checkpoint_policy_v1.json'
      - 'content/storage_restore_policy_v1.json'
      - 'content/storage_retention_policy_v1.json'
      - 'content/storage_cutover_policy_v1.json'
      - 'content/storage_migration_policy_v1.json'
      - 'content/storage_config.json'
      - 'worker/validate_clone_memory_event.py'
      - 'worker/validate_clone_memory_checkpoint.py'
      - 'worker/validate_storage_migration_manifest.py'
      - 'worker/validate_storage_restore.py'
      - 'worker/validate_storage_cutover.py'
      - 'worker/validate_clone_data_governance.py'
      - '.github/workflows/clone-data-governance-qa.yml'
  pull_request:
    paths:
      - 'content/clone_memory_policy_v1.json'
      - 'content/clone_memory_checkpoint_policy_v1.json'
      - 'content/storage_restore_policy_v1.json'
      - 'content/storage_retention_policy_v1.json'
      - 'content/storage_cutover_policy_v1.json'
      - 'content/storage_migration_policy_v1.json'
      - 'content/storage_config.json'
      - 'worker/validate_clone_memory_event.py'
      - 'worker/validate_clone_memory_checkpoint.py'
      - 'worker/validate_storage_migration_manifest.py'
      - 'worker/validate_storage_restore.py'
      - 'worker/validate_storage_cutover.py'
      - 'worker/validate_clone_data_governance.py'
      - '.github/workflows/clone-data-governance-qa.yml'

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate data governance policy graph
        run: python worker/validate_clone_data_governance.py
      - name: Python syntax sanity
        run: |
          python -m py_compile \
            worker/validate_clone_memory_event.py \
            worker/validate_clone_memory_checkpoint.py \
            worker/validate_storage_migration_manifest.py \
            worker/validate_storage_restore.py \
            worker/validate_storage_cutover.py \
            worker/validate_clone_data_governance.py
      - name: Assert fail-closed contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          checks = {
            'worker/validate_clone_memory_event.py': [
              'automatic_self_training_forbidden', 'approved_memory_requires_manual_approval',
              'raw_biometric_payload_forbidden', 'rejected_memory_cannot_train',
              'recursive_secret_scan_enforced', 'secret_value_signature_scan_enforced'
            ],
            'worker/validate_clone_memory_checkpoint.py': [
              'storage_version_id_required', 'immutable_retention_not_confirmed',
              'independent_backup_not_confirmed', 'manual_checkpoint_approval_required', 'CHECKPOINT_REJECTED'
            ],
            'worker/validate_storage_migration_manifest.py': [
              'BLOCK_MIGRATION', 'object_', 'secret_field_forbidden', 'PASS_TO_RESTORE_TEST'
            ],
            'worker/validate_storage_restore.py': [
              'production_overwrite_forbidden', 'decrypted_hash_verification_failed', 'BLOCK_RESTORE'
            ],
            'worker/validate_storage_cutover.py': [
              'automatic_cutover_forbidden', 'source_deletion_forbidden_during_cutover',
              'backup_not_independently_verified', 'memory_checkpoint_not_verified',
              'trusted_clone_memory_checkpoint_verified', 'BLOCK_CUTOVER'
            ],
          }
          for path, tokens in checks.items():
              text = Path(path).read_text(encoding='utf-8')
              missing = [t for t in tokens if t not in text]
              if missing:
                  raise SystemExit(f'{path} missing safeguards: {missing}')
          print('Clone data governance validators are fail-closed')
          PY
      - name: Exercise recursive Clone Memory rejection
        run: |
          python - <<'PY'
          import json, subprocess, sys, tempfile
          from pathlib import Path
          base = {
            'memory_id': 'ci-memory-1',
            'domain': 'provenance',
            'version': 1,
            'source_type': 'synthetic_ci',
            'source_ref': 'ci://synthetic',
            'source_sha256': 'a' * 64,
            'created_at': '2026-09-05T00:00:00Z',
            'decision': 'CANDIDATE',
            'notes': 'CI only',
            'automatic_self_training': False,
          }
          with tempfile.TemporaryDirectory() as td:
            td = Path(td)
            good = td / 'good.json'
            good.write_text(json.dumps(base), encoding='utf-8')
            if subprocess.run([sys.executable, 'worker/validate_clone_memory_event.py', '--event', str(good)]).returncode != 0:
              raise SystemExit('Valid Clone Memory event was rejected')

            nested_secret = dict(base)
            nested_secret['metadata'] = {'runtime': {'client_secret': 'do-not-store-this'}}
            bad1 = td / 'bad-secret.json'
            bad1.write_text(json.dumps(nested_secret), encoding='utf-8')
            if subprocess.run([sys.executable, 'worker/validate_clone_memory_event.py', '--event', str(bad1)]).returncode == 0:
              raise SystemExit('Nested secret field was not rejected')

            nested_biometric = dict(base)
            nested_biometric['metadata'] = {'payload': {'raw_voice_payload': 'forbidden'}}
            bad2 = td / 'bad-biometric.json'
            bad2.write_text(json.dumps(nested_biometric), encoding='utf-8')
            if subprocess.run([sys.executable, 'worker/validate_clone_memory_event.py', '--event', str(bad2)]).returncode == 0:
              raise SystemExit('Nested raw biometric payload was not rejected')
          print('Recursive Clone Memory secret/biometric rejection works')
          PY
      - name: Exercise storage cutover memory checkpoint gate
        run: |
          python - <<'PY'
          import copy, json, subprocess, sys, tempfile
          from pathlib import Path
          good = {
            'migration_manifest_sha256': 'a' * 64,
            'expected_object_count': 3,
            'verified_object_count': 3,
            'failed_object_count': 0,
            'restore_evaluation_sha256': 'b' * 64,
            'backup_verification': {'verified': True, 'independent_credentials': True},
            'runtime_storage_readiness': {
              'credentials_complete': True,
              'client_side_encryption_enabled': True,
              'versioning_enabled': True,
              'eu_region_policy_passed': True,
            },
            'memory_checkpoint_verification': {
              'checkpoint_evaluation_sha256': 'c' * 64,
              'checkpoint_validation_passed': True,
              'storage_version_verified': True,
              'immutable_retention_verified': True,
              'independent_backup_verified': True,
              'manual_approval_verified': True,
            },
            'rollback_target': 'google_drive_legacy_read_only',
            'decision': 'PASS_TO_MANUAL_CUTOVER',
            'source_deleted': False,
            'automatic_cutover_performed': False,
          }
          with tempfile.TemporaryDirectory() as td:
            td = Path(td)
            ok = td / 'cutover-ok.json'
            ok.write_text(json.dumps(good), encoding='utf-8')
            if subprocess.run([sys.executable, 'worker/validate_storage_cutover.py', '--evidence', str(ok)]).returncode != 0:
              raise SystemExit('Complete cutover evidence was rejected')

            missing_checkpoint = copy.deepcopy(good)
            del missing_checkpoint['memory_checkpoint_verification']
            bad1 = td / 'cutover-no-checkpoint.json'
            bad1.write_text(json.dumps(missing_checkpoint), encoding='utf-8')
            if subprocess.run([sys.executable, 'worker/validate_storage_cutover.py', '--evidence', str(bad1)]).returncode == 0:
              raise SystemExit('Cutover passed without Clone Memory checkpoint evidence')

            unverified_version = copy.deepcopy(good)
            unverified_version['memory_checkpoint_verification']['storage_version_verified'] = False
            bad2 = td / 'cutover-unverified-version.json'
            bad2.write_text(json.dumps(unverified_version), encoding='utf-8')
            if subprocess.run([sys.executable, 'worker/validate_storage_cutover.py', '--evidence', str(bad2)]).returncode == 0:
              raise SystemExit('Cutover passed without verified checkpoint storage version')

            string_count = copy.deepcopy(good)
            string_count['expected_object_count'] = '3'
            bad3 = td / 'cutover-string-count.json'
            bad3.write_text(json.dumps(string_count), encoding='utf-8')
            if subprocess.run([sys.executable, 'worker/validate_storage_cutover.py', '--evidence', str(bad3)]).returncode == 0:
              raise SystemExit('Cutover accepted non-integer migration count')
          print('Storage cutover requires real trusted Clone Memory checkpoint evidence')
          PY
      - name: Reject secret or raw biometric payload patterns in policies
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('content').glob('*policy_v1.json'):
              text = path.read_text(encoding='utf-8')
              json.loads(text)
              for bad in ('BEGIN PRIVATE KEY', 'aws_secret_access_key=', 'AI_TWIN_DATA_ENCRYPTION_KEY='):
                  if bad in text:
                      raise SystemExit(f'Secret material detected in {path}: {bad}')
          print('No secret material embedded in clone data governance policies')
          PY
