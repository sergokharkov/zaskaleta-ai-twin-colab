name: Clone Duplicate Gate QA
on:
  push:
    paths:
      - 'worker/validate_clone_duplicate.py'
      - 'content/clone_duplicate_gate_v1.json'
      - '.github/workflows/clone-duplicate-gate-qa.yml'
  workflow_dispatch:
jobs:
  duplicate-gate-cpu-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Build synthetic videos
        run: |
          set -e
          mkdir -p .qa
          ffmpeg -v error -f lavfi -i 'testsrc2=size=320x240:rate=30' -t 4 -c:v libx264 -pix_fmt yuv420p .qa/base.mp4
          ffmpeg -v error -i .qa/base.mp4 -c:v libx264 -crf 28 -pix_fmt yuv420p .qa/reencoded.mp4
          ffmpeg -v error -f lavfi -i 'color=c=black:size=320x240:rate=30' -t 2 -c:v libx264 -pix_fmt yuv420p .qa/tail.mp4
          ffmpeg -v error -f lavfi -i 'smptebars=size=320x240:rate=30' -t 4 -c:v libx264 -pix_fmt yuv420p .qa/unique.mp4
          printf "file 'base.mp4'\nfile 'tail.mp4'\n" > .qa/list.txt
          ffmpeg -v error -f concat -safe 0 -i .qa/list.txt -c copy .qa/extended.mp4
          printf "file 'tail.mp4'\nfile 'base.mp4'\n" > .qa/list.txt
          ffmpeg -v error -f concat -safe 0 -i .qa/list.txt -c copy .qa/prefix.mp4
          printf "file 'tail.mp4'\nfile 'base.mp4'\nfile 'tail.mp4'\n" > .qa/list.txt
          ffmpeg -v error -f concat -safe 0 -i .qa/list.txt -c copy .qa/shifted.mp4
      - name: Two complete CPU QA passes
        run: |
          set -eu
          for pass in 1 2; do
            for case in base reencoded extended prefix shifted; do
              set +e
              python worker/validate_clone_duplicate.py --candidate .qa/$case.mp4 --prior .qa/base.mp4 --output .qa/${case}_${pass}.json
              rc=$?
              set -e
              test "$rc" -eq 2
              python -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["decision"] == "DUPLICATE_CANDIDATE" and r["hard_fail_flag"] == "duplicate_candidate" and r["manual_override_allowed"] is False' .qa/${case}_${pass}.json
            done
            python worker/validate_clone_duplicate.py --candidate .qa/unique.mp4 --prior .qa/base.mp4 --output .qa/unique_${pass}.json
            python -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["decision"] == "UNIQUE_ENOUGH" and r["hard_fail_flag"] is None' .qa/unique_${pass}.json
            set +e
            python worker/validate_clone_duplicate.py --candidate .qa/base.mp4 --prior .qa/missing.mp4 --output .qa/missing_${pass}.json
            rc=$?
            set -e
            test "$rc" -ne 0
            echo "CPU_PASS_${pass}_VERIFIED"
          done
          echo C004_DUPLICATE_GATE_CPU_VERIFIED
