name: Clone Memory Checkpoint QA

on:
  push:
    branches: [main]
    paths:
      - 'content/clone_memory_checkpoint_policy_v1.json'
      - 'worker/validate_clone_memory_checkpoint.py'
      - '.github/workflows/clone-memory-checkpoint-qa.yml'
  pull_request:
    paths:
      - 'content/clone_memory_checkpoint_policy_v1.json'
      - 'worker/validate_clone_memory_checkpoint.py'
      - '.github/workflows/clone-memory-checkpoint-qa.yml'

permissions:
  contents: read

jobs:
  checkpoint-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax sanity
        run: python -m py_compile worker/validate_clone_memory_checkpoint.py
      - name: Validate checkpoint policy contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('content/clone_memory_checkpoint_policy_v1.json').read_text(encoding='utf-8'))
          assert p['schema'] == 'zaskaleta-clone-memory-checkpoint-policy-v1'
          assert p['automatic_trust_promotion'] is False
          assert p['manual_checkpoint_approval_required'] is True
          assert p['storage']['provider'] == 's3_compatible'
          assert p['storage']['region_policy'] == 'EU_ONLY'
          assert p['storage']['versioning_required'] is True
          assert p['storage']['object_lock_or_equivalent_immutable_retention_required_for_trusted_checkpoint'] is True
          assert p['storage']['independent_backup_required'] is True
          assert p['rules']['checkpoint_overwrite_forbidden'] is True
          assert p['rules']['full_chain_rewrite_requires_checkpoint_mismatch_failure'] is True
          print('Clone Memory external checkpoint policy is fail-closed')
          PY
      - name: Exercise positive and negative checkpoint validation
        run: |
          python - <<'PY'
          import json, subprocess, sys, tempfile
          from pathlib import Path
          good = {
            'checkpoint_id': 'ci-checkpoint-1',
            'memory_chain_head_sha256': 'a' * 64,
            'event_count': 2,
            'created_at': '2026-09-05T00:00:00Z',
            'source_log_sha256': 'b' * 64,
            'storage_object_key': 'MASTER_CLONE/MEMORY/CHECKPOINTS/ci-checkpoint-1.json',
            'storage_version_id': 'ci-version-1',
            'immutable_retention_confirmed': True,
            'independent_backup_confirmed': True,
            'manual_approval': True
          }
          with tempfile.TemporaryDirectory() as td:
            td = Path(td)
            ok = td / 'ok.json'; ok.write_text(json.dumps(good), encoding='utf-8')
            if subprocess.run([sys.executable, 'worker/validate_clone_memory_checkpoint.py', '--checkpoint', str(ok)]).returncode != 0:
              raise SystemExit('Valid synthetic checkpoint rejected')

            no_lock = dict(good); no_lock['immutable_retention_confirmed'] = False
            bad1 = td / 'bad-lock.json'; bad1.write_text(json.dumps(no_lock), encoding='utf-8')
            if subprocess.run([sys.executable, 'worker/validate_clone_memory_checkpoint.py', '--checkpoint', str(bad1)]).returncode == 0:
              raise SystemExit('Checkpoint without immutable retention accepted')

            no_backup = dict(good); no_backup['independent_backup_confirmed'] = False
            bad2 = td / 'bad-backup.json'; bad2.write_text(json.dumps(no_backup), encoding='utf-8')
            if subprocess.run([sys.executable, 'worker/validate_clone_memory_checkpoint.py', '--checkpoint', str(bad2)]).returncode == 0:
              raise SystemExit('Checkpoint without independent backup accepted')

            secret = dict(good); secret['metadata'] = {'client_secret': 'must-not-be-stored'}
            bad3 = td / 'bad-secret.json'; bad3.write_text(json.dumps(secret), encoding='utf-8')
            if subprocess.run([sys.executable, 'worker/validate_clone_memory_checkpoint.py', '--checkpoint', str(bad3)]).returncode == 0:
              raise SystemExit('Checkpoint containing nested secret field accepted')
          print('Clone Memory checkpoint validator rejects missing lock/backup and nested secrets')
          PY
