name: Clone Memory Runtime QA

on:
  push:
    branches: [main]
    paths:
      - 'content/clone_memory_policy_v1.json'
      - 'worker/validate_clone_memory_event.py'
      - 'worker/append_clone_memory_event.py'
      - '.github/workflows/clone-memory-runtime-qa.yml'
  pull_request:
    paths:
      - 'content/clone_memory_policy_v1.json'
      - 'worker/validate_clone_memory_event.py'
      - 'worker/append_clone_memory_event.py'
      - '.github/workflows/clone-memory-runtime-qa.yml'

permissions:
  contents: read

jobs:
  memory-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax sanity
        run: python -m py_compile worker/validate_clone_memory_event.py worker/append_clone_memory_event.py
      - name: Append-only runtime smoke test
        run: |
          tmp="$(mktemp -d)"
          cat > "$tmp/event.json" <<'JSON'
          {
            "memory_id": "ci-quality-001",
            "domain": "quality_history",
            "version": "v1",
            "source_type": "ci_test",
            "source_ref": "synthetic/non-biometric",
            "source_sha256": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
            "created_at": "2026-09-05T00:00:00Z",
            "decision": "CANDIDATE",
            "notes": "CI-only synthetic memory event",
            "eligible_for_training": false
          }
          JSON
          python worker/append_clone_memory_event.py --event "$tmp/event.json" --storage-root "$tmp/storage"
          test -s "$tmp/storage/MASTER_CLONE/MEMORY/events_v1.jsonl"
          if python worker/append_clone_memory_event.py --event "$tmp/event.json" --storage-root "$tmp/storage"; then
            echo 'Duplicate memory_id was incorrectly accepted'
            exit 1
          fi
      - name: Enforce runtime safety contract
        run: |
          python - <<'PY'
          from pathlib import Path
          t = Path('worker/append_clone_memory_event.py').read_text(encoding='utf-8')
          required = ['append_only_versioned', 'duplicate_memory_id', 'os.fsync', "'automatic_self_training'] = False", 'validate_clone_memory_event.py']
          missing = [x for x in required if x not in t]
          if missing:
              raise SystemExit('Clone Memory runtime weakened: ' + ', '.join(missing))
          forbidden = ['boto3', 'requests.post(', 'runpodctl', 'git add']
          hits = [x for x in forbidden if x in t]
          if hits:
              raise SystemExit('Clone Memory writer has forbidden side effects: ' + ', '.join(hits))
          print('Clone Memory runtime is append-only, duplicate-safe, validated, and has no training/network side effects')
          PY
