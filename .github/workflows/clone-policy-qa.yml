name: Clone Policy QA

on:
  push:
    branches: [main]
    paths:
      - 'content/user_video_candidates_*.json'
      - 'content/training_candidates_*.json'
      - 'content/clone_quality_gate_v1.json'
      - 'content/clone_release_policy_v1.json'
      - 'content/render_face_guard_v1.json'
      - 'content/identity_view_holdout_v1.json'
      - 'content/master_clone_package.json'
      - 'worker/validate_candidate_registry.py'
      - 'worker/validate_identity_view_holdout.py'
      - 'worker/evaluate_identity_view_results.py'
      - 'worker/evaluate_clone_release.py'
      - 'worker/compare_clone_challenger.py'
      - 'worker/generate_scene_keyframes.py'
      - 'worker/run_clone_v2_test.py'
      - '.github/workflows/clone-policy-qa.yml'
  pull_request:
    paths:
      - 'content/user_video_candidates_*.json'
      - 'content/training_candidates_*.json'
      - 'content/clone_quality_gate_v1.json'
      - 'content/clone_release_policy_v1.json'
      - 'content/render_face_guard_v1.json'
      - 'content/identity_view_holdout_v1.json'
      - 'content/master_clone_package.json'
      - 'worker/validate_candidate_registry.py'
      - 'worker/validate_identity_view_holdout.py'
      - 'worker/evaluate_identity_view_results.py'
      - 'worker/evaluate_clone_release.py'
      - 'worker/compare_clone_challenger.py'
      - 'worker/generate_scene_keyframes.py'
      - 'worker/run_clone_v2_test.py'
      - '.github/workflows/clone-policy-qa.yml'

permissions:
  contents: read

jobs:
  controlled-learning-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate candidate registries
        run: python worker/validate_candidate_registry.py
      - name: Validate multi-angle identity holdout
        run: python worker/validate_identity_view_holdout.py
      - name: Validate clone policy invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          quality = json.loads(Path('content/clone_quality_gate_v1.json').read_text(encoding='utf-8'))
          release = json.loads(Path('content/clone_release_policy_v1.json').read_text(encoding='utf-8'))
          guard = json.loads(Path('content/render_face_guard_v1.json').read_text(encoding='utf-8'))
          holdout = json.loads(Path('content/identity_view_holdout_v1.json').read_text(encoding='utf-8'))
          master = json.loads(Path('content/master_clone_package.json').read_text(encoding='utf-8'))

          assert quality.get('manual_approval_required') is True
          assert quality.get('auto_promote_to_master') is False
          assert release.get('manual_promotion_required') is True
          assert release.get('auto_promote') is False
          assert float(release.get('identity_regression_tolerance', 1)) == 0.0
          assert set(release.get('identity_metrics') or []) == {'identity_similarity', 'identity_drift'}
          assert holdout.get('required_views') == release.get('face_regression_policy', {}).get('required_views')
          assert float((holdout.get('rules') or {}).get('identity_regression_tolerance', 1)) == 0.0

          identity_policy = guard.get('identity_policy') or {}
          assert identity_policy.get('canonical_reference_only_for_generation') is True
          assert identity_policy.get('no_beautification') is True
          assert identity_policy.get('no_rejuvenation') is True
          assert identity_policy.get('no_face_redesign') is True
          assert identity_policy.get('no_identity_substitution') is True
          assert float(identity_policy.get('release_identity_regression_tolerance', 1)) == 0.0
          assert guard.get('reject_if_multiple_faces') is True
          assert int(guard.get('max_face_count', 99)) == 1

          lifecycle = master.get('improvement_lifecycle') or {}
          assert lifecycle.get('stable_release_is_immutable') is True
          assert lifecycle.get('manual_promotion_required') is True
          assert lifecycle.get('holdout_regression_set') is True

          print('Clone policy invariants OK: zero identity regression, multi-angle holdout, immutable stable release, manual promotion only')
          PY
      - name: Enforce identity view evaluator invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('worker/evaluate_identity_view_results.py').read_text(encoding='utf-8')
          required = [
              "identity_drift > 0.0",
              "face_structure_drift",
              "age_regression",
              "beard_regression",
              "hairline_regression",
              "jaw_regression",
              "mouth_regression",
              "asymmetry_loss",
              "manual_override_allowed': False",
              "PASS_TO_MANUAL_PROMOTION_REVIEW",
              "BLOCK_PROMOTION",
          ]
          missing = [token for token in required if token not in source]
          if missing:
              raise SystemExit('Identity view evaluator weakened or incomplete: ' + ', '.join(missing))
          print('Identity view evaluator enforces zero-regression blocking across all required angles')
          PY
      - name: Enforce render policy at runtime
        run: |
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          guard = json.loads(Path('content/render_face_guard_v1.json').read_text(encoding='utf-8'))
          source_path = Path('worker/generate_scene_keyframes.py')
          tree = ast.parse(source_path.read_text(encoding='utf-8'))
          constants = {}
          for node in tree.body:
              if isinstance(node, ast.Assign) and len(node.targets) == 1 and isinstance(node.targets[0], ast.Name):
                  try:
                      constants[node.targets[0].id] = ast.literal_eval(node.value)
                  except Exception:
                      pass

          expected = {
              'IDENTITY_SCALE': float(guard['identity_scale']),
              'DEFAULT_ATTEMPTS': int(guard['attempts']),
              'MIN_FACE_AREA_RATIO': float(guard['face_area_ratio_min']),
              'MAX_FACE_AREA_RATIO': float(guard['face_area_ratio_max']),
              'MIN_FACE_SHARPNESS': float(guard['face_sharpness_min']),
              'MAX_FACE_COUNT': int(guard['max_face_count']),
          }
          for name, value in expected.items():
              actual = constants.get(name)
              if actual != value:
                  raise SystemExit(f'{name} runtime mismatch: code={actual!r} policy={value!r}')

          text = source_path.read_text(encoding='utf-8')
          required_runtime_guards = [
              'multiple_faces_detected',
              'no_face_detected',
              'face_size_out_of_range',
              'face_too_soft',
              'REJECTED_BEFORE_SAVE',
              'CANONICAL IDENTITY LOCK',
          ]
          missing = [token for token in required_runtime_guards if token not in text]
          if missing:
              raise SystemExit('Missing runtime identity guard tokens: ' + ', '.join(missing))

          print('Render runtime matches render_face_guard_v1 exactly')
          PY
      - name: Enforce Clone v2 canonical identity preflight
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('worker/run_clone_v2_test.py').read_text(encoding='utf-8')
          required = [
              'Canonical identity photo is not explicitly configured; refusing fallback identity',
              'Canonical identity mismatch:',
              'Canonical identity must resolve to exactly one approved photo',
              'CLONE_V2_IDENTITY_PREFLIGHT.json',
              "'fallback_identity_allowed': False",
              'canonical_identity_sha256',
              'master_voice_sha256',
              'reference_behavior_sha256',
          ]
          missing = [token for token in required if token not in source]
          if missing:
              raise SystemExit('Clone v2 identity preflight weakened or missing: ' + ', '.join(missing))

          forbidden = [
              "next((p for p in photos if p.name == canonical_name), photos[0])",
              "canonical = photos[0]",
          ]
          hits = [token for token in forbidden if token in source]
          if hits:
              raise SystemExit('Unsafe Clone v2 identity fallback detected: ' + ', '.join(hits))

          print('Clone v2 canonical identity preflight is enforced with no implicit fallback')
          PY
      - name: Python syntax sanity
        run: |
          python -m py_compile \
            worker/validate_candidate_registry.py \
            worker/validate_identity_view_holdout.py \
            worker/evaluate_identity_view_results.py \
            worker/evaluate_clone_release.py \
            worker/compare_clone_challenger.py \
            worker/generate_scene_keyframes.py \
            worker/run_clone_v2_test.py
      - name: Reject raw biometric media tracked by Git
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          media_exts = {'.mp4', '.mov', '.m4v', '.webm', '.wav', '.m4a', '.mp3', '.jpg', '.jpeg', '.png', '.webp'}
          allowed_generated_prefixes = ('outputs/', 'examples/')
          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          offenders = []
          for item in tracked:
              path = Path(item)
              if path.suffix.lower() not in media_exts:
                  continue
              normalized = item.replace('\\', '/')
              if normalized.startswith(allowed_generated_prefixes):
                  continue
              offenders.append(item)
          if offenders:
              raise SystemExit('Raw/private media must not be tracked in GitHub: ' + ', '.join(offenders))
          print('No raw/private biometric media files are tracked by Git')
          PY
