name: Clone v2 RunPod Readiness QA

on:
  push:
    branches: [main]
    paths:
      - 'runpod/api_server.py'
      - 'runpod/requirements-api.txt'
      - 'runpod/clone_v2_readiness.py'
      - 'runpod/preflight.py'
      - 'worker/run_clone_v2_test.py'
      - 'worker/lipsync_musetalk.py'
      - 'worker/generate_scene_speech.py'
      - 'worker/evaluate_clone_release.py'
      - 'worker/evaluate_identity_view_results.py'
      - 'worker/compare_clone_challenger.py'
      - 'worker/validate_clone_promotion_bundle.py'
      - 'worker/validate_clone_duration_progression.py'
      - 'worker/validate_clone_v2_temporal_output.py'
      - 'worker/storage_backend.py'
      - 'worker/validate_storage_cutover.py'
      - 'worker/validate_storage_restore.py'
      - 'worker/validate_clone_data_governance.py'
      - 'worker/verify_clone_memory_chain.py'
      - 'content/clone_reference_profile.json'
      - 'content/talking_profile_v2.json'
      - 'content/clone_quality_gate_v1.json'
      - 'content/clone_release_policy_v1.json'
      - 'content/render_face_guard_v1.json'
      - 'content/talking_temporal_guard_v1.json'
      - 'content/identity_view_holdout_v1.json'
      - 'content/clone_promotion_bundle_policy_v1.json'
      - 'content/clone_duration_gate_policy_v1.json'
      - 'content/clone_memory_policy_v1.json'
      - 'content/storage_config.json'
      - 'content/storage_migration_policy_v1.json'
      - '.github/workflows/clone-v2-runpod-readiness-qa.yml'
  pull_request:
    paths:
      - 'runpod/**'
      - 'worker/**'
      - 'content/**'
      - '.github/workflows/clone-v2-runpod-readiness-qa.yml'

permissions:
  contents: read

jobs:
  static-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax sanity
        run: |
          python -m py_compile \
            runpod/api_server.py \
            runpod/clone_v2_readiness.py \
            runpod/preflight.py \
            worker/storage_backend.py
      - name: Verify Clone v2 static RunPod readiness
        run: python runpod/clone_v2_readiness.py
      - name: Validate S3 storage policy without secrets or network calls
        run: python worker/storage_backend.py
      - name: Enforce Drive-free API runtime and minimal dependencies
        run: |
          python - <<'PY'
          from pathlib import Path

          api = Path('runpod/api_server.py').read_text(encoding='utf-8')
          req = Path('runpod/requirements-api.txt').read_text(encoding='utf-8')

          required = [
              "'storage_provider': 's3_compatible'",
              "'google_drive_production_dependency': False",
              "'storage_contract_valid': storage_contract_valid",
              "'storage_runtime_ready': storage_runtime_ready()",
              "'secret_values_exposed': False",
              "version='0.4.0'",
          ]
          missing = [token for token in required if token not in api]
          if missing:
              raise SystemExit('Clone API storage contract missing: ' + ', '.join(missing))

          forbidden_api = [
              'AI_TWIN_DRIVE_SYNC',
              'AI_TWIN_DRIVE_FOLDER_ID',
              'CANONICAL_DRIVE_FOLDER_ID',
              'DRIVE_SYNC_ENABLED',
              'pull_canonical_drive',
              'fixed_drive_folder_sync.py',
              "photo: str | None",
              "voice: str | None",
              "referenceVideo: str | None",
          ]
          hits = [token for token in forbidden_api if token in api]
          if hits:
              raise SystemExit('Legacy Drive/path override behavior remains in Clone API: ' + ', '.join(hits))

          forbidden_deps = ['google-auth', 'google-api-python-client']
          dep_hits = [token for token in forbidden_deps if token in req]
          if dep_hits:
              raise SystemExit('Obsolete Google runtime dependencies remain: ' + ', '.join(dep_hits))

          print('Clone API runtime is Drive-free, fail-closed on storage readiness, and exposes no caller-controlled biometric paths')
          PY
      - name: Assert no paid GPU or secret side effects
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              Path('runpod/api_server.py'),
              Path('runpod/clone_v2_readiness.py'),
              Path('runpod/preflight.py'),
          ]
          joined = '\n'.join(p.read_text(encoding='utf-8') for p in files)

          required = [
              'paid_gpu_started',
              'manual_budget_approval_required_before_gpu_start',
              'first_test_gate_seconds',
              'google_drive_production_dependency',
              'secret_values_exposed',
              'storage_contract',
              'storage_backend_policy',
          ]
          missing = [token for token in required if token not in joined]
          if missing:
              raise SystemExit('RunPod readiness/preflight safety contract missing: ' + ', '.join(missing))

          forbidden = [
              'runpodctl create',
              'runpodctl pod create',
              'flash deploy',
              'requests.post(',
              'boto3.client(',
              'create_pod(',
              'create_endpoint(',
              'print(TOKEN)',
              'print(os.environ)',
              'GOOGLE_APPLICATION_CREDENTIALS',
              'AI_TWIN_DRIVE_SYNC',
          ]
          hits = [token for token in forbidden if token in joined]
          if hits:
              raise SystemExit('Forbidden provisioning/secret/legacy-drive behavior found: ' + ', '.join(hits))

          print('RunPod/API readiness cannot provision paid GPU, expose secrets, or depend on Google Drive')
          PY
