name: Kaggle MASTER CLONE Autopilot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'kaggle/**'
      - 'worker/lipsync_musetalk.py'
      - 'worker/generate_scene_speech.py'
      - 'worker/voice_mms_openvoice.py'
      - 'content/clone_quality_gate_v1.json'
      - 'content/clone_release_policy_v1.json'
      - 'content/clone_duration_gate_policy_v1.json'
      - '.github/workflows/kaggle-autopilot.yml'

permissions:
  contents: read

concurrency:
  group: kaggle-master-clone-autopilot
  cancel-in-progress: true

jobs:
  submit-kaggle:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KERNEL_SLUG: ${{ secrets.KAGGLE_KERNEL_SLUG }}
      KAGGLE_PRIVATE_DATASET: ${{ secrets.KAGGLE_PRIVATE_DATASET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate required Kaggle secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}" || { echo 'Missing KAGGLE_API_TOKEN secret'; exit 2; }
          test -n "${KAGGLE_USERNAME:-}" || { echo 'Missing KAGGLE_USERNAME secret'; exit 2; }
          test -n "${KAGGLE_KERNEL_SLUG:-}" || { echo 'Missing KAGGLE_KERNEL_SLUG secret'; exit 2; }
          test -n "${KAGGLE_PRIVATE_DATASET:-}" || { echo 'Missing KAGGLE_PRIVATE_DATASET secret'; exit 2; }
          case "$KAGGLE_KERNEL_SLUG" in
            *[!a-z0-9-]*|'') echo 'KAGGLE_KERNEL_SLUG must contain only a-z, 0-9 and -'; exit 2 ;;
          esac
          case "$KAGGLE_PRIVATE_DATASET" in
            */*) ;;
            *) echo 'KAGGLE_PRIVATE_DATASET must be owner/dataset-slug'; exit 2 ;;
          esac

      - name: Install Kaggle CLI
        run: python -m pip install --disable-pip-version-check --quiet 'kaggle>=1.8.0'

      - name: Verify Kaggle authentication
        shell: bash
        run: |
          set -euo pipefail
          kaggle datasets list -m --sort-by updated --max-size 1 >/dev/null
          echo 'Kaggle API authentication succeeded.'

      - name: Build private Kaggle kernel package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .kaggle-autopilot
          mkdir -p .kaggle-autopilot
          cp kaggle/autopilot_kernel.py .kaggle-autopilot/autopilot_kernel.py

          python - <<'PY'
          import json, os, pathlib
          username = os.environ['KAGGLE_USERNAME']
          slug = os.environ['KAGGLE_KERNEL_SLUG']
          private_dataset = os.environ['KAGGLE_PRIVATE_DATASET'].strip()
          meta = {
              'id': f'{username}/{slug}',
              'title': 'Zaskaleta MASTER CLONE Autopilot',
              'code_file': 'autopilot_kernel.py',
              'language': 'python',
              'kernel_type': 'script',
              'is_private': True,
              'enable_gpu': True,
              'enable_internet': True,
              'dataset_sources': [private_dataset],
              'competition_sources': [],
              'kernel_sources': [],
          }
          pathlib.Path('.kaggle-autopilot/kernel-metadata.json').write_text(
              json.dumps(meta, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY

      - name: Submit and automatically run private Kaggle kernel
        shell: bash
        run: |
          set -euo pipefail
          kaggle kernels push -p .kaggle-autopilot --timeout 7200 --accelerator gpu
          echo "Submitted and started ${KAGGLE_USERNAME}/${KAGGLE_KERNEL_SLUG}"

      - name: Follow Kaggle run until completion
        shell: bash
        run: |
          set -euo pipefail
          KERNEL="${KAGGLE_USERNAME}/${KAGGLE_KERNEL_SLUG}"
          echo "Following Kaggle logs for ${KERNEL}"
          timeout 6600 kaggle kernels logs "$KERNEL" --follow --interval 15 || rc=$?
          rc=${rc:-0}
          if [ "$rc" -eq 124 ]; then
            echo 'Timed out waiting for Kaggle kernel logs after 110 minutes.'
            exit 1
          fi

          # Kaggle log streaming can end a few seconds before server-side output is
          # finalized. Poll the authoritative kernel status until it is terminal.
          deadline=$((SECONDS + 600))
          while :; do
            status_out="$(kaggle kernels status "$KERNEL" 2>&1)"
            echo "$status_out"
            if echo "$status_out" | grep -Eq 'COMPLETE|SUCCESS|ERROR|CANCEL|FAILED'; then
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo 'Timed out waiting for Kaggle terminal status after log stream ended.'
              exit 1
            fi
            sleep 10
          done

          if echo "$status_out" | grep -Eq 'ERROR|CANCEL|FAILED'; then
            echo 'Kaggle kernel finished unsuccessfully.'
            exit 1
          fi

      - name: Read safe autopilot status only
        shell: bash
        run: |
          set -euo pipefail
          KERNEL="${KAGGLE_USERNAME}/${KAGGLE_KERNEL_SLUG}"
          rm -rf .kaggle-status
          mkdir -p .kaggle-status

          # Output publication can lag terminal status briefly. Retry only the small
          # status JSON; never download render media or raw/private biometric assets.
          STATUS_FILE=''
          for attempt in $(seq 1 12); do
            rm -rf .kaggle-status/*
            kaggle kernels output "$KERNEL" \
              -p .kaggle-status \
              --file-pattern '(^|/)zaskaleta_autopilot_status\.json$' \
              -q || true
            STATUS_FILE="$(find .kaggle-status -type f -name 'zaskaleta_autopilot_status.json' -print -quit)"
            if [ -n "$STATUS_FILE" ]; then
              break
            fi
            echo "Status JSON not published yet (attempt ${attempt}/12); waiting 10s."
            sleep 10
          done
          test -n "$STATUS_FILE" || { echo 'Autopilot status JSON was not produced.'; exit 1; }

          python - "$STATUS_FILE" <<'PY'
          import json, pathlib, sys
          p = pathlib.Path(sys.argv[1])
          data = json.loads(p.read_text(encoding='utf-8'))
          safe = {
              'schema': data.get('schema'),
              'state': data.get('state'),
              'render_started': data.get('render_started'),
              'render_completed': data.get('render_completed'),
              'first_gate_render_duration_seconds': data.get('first_gate_render_duration_seconds'),
              'subjective_identity_review': data.get('subjective_identity_review'),
              'promotion_allowed': data.get('promotion_allowed'),
              'auto_promote': data.get('auto_promote'),
              'stable_release_modified': data.get('stable_release_modified'),
          }
          print(json.dumps(safe, ensure_ascii=False, indent=2))
          state = data.get('state')
          if state != 'FIRST_GATE_RENDER_READY_FOR_MANUAL_REVIEW':
              raise SystemExit(f'Unexpected/failing autopilot state: {state}')
          if data.get('render_completed') is not True:
              raise SystemExit('First gate render did not complete')
          duration = data.get('first_gate_render_duration_seconds')
          if not isinstance(duration, (int, float)) or not (8 <= duration <= 15):
              raise SystemExit(f'First gate duration outside 8-15 seconds: {duration}')
          if data.get('promotion_allowed') is not False or data.get('auto_promote') is not False:
              raise SystemExit('Promotion safety contract was weakened')
          if data.get('stable_release_modified') is not False:
              raise SystemExit('Stable release was unexpectedly modified')
          print('FIRST_GATE_RENDER_READY_FOR_MANUAL_REVIEW confirmed.')
          PY

      - name: Safety summary
        if: always()
        run: |
          echo 'Kaggle kernel is private.'
          echo 'GitHub never downloads render media or raw biometric assets.'
          echo 'No paid GPU is provisioned by this workflow.'
          echo 'No clone is auto-promoted.'
          echo 'Stable release remains immutable.'
          echo 'The first 8-15s candidate remains quarantined pending manual visual identity review.'
