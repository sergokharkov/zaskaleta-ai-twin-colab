name: Kaggle MASTER CLONE C003 Isolated

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kaggle-c003-isolated.yml'

permissions:
  contents: read

concurrency:
  group: kaggle-master-clone-c003-isolated
  cancel-in-progress: false

jobs:
  render-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_PRIVATE_DATASET: ${{ secrets.KAGGLE_PRIVATE_DATASET }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kaggle clients
        run: python -m pip install --disable-pip-version-check --quiet 'kaggle>=1.8.0' 'kagglehub>=0.3.13'
      - name: Build immutable private kernel package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          root=pathlib.Path.cwd(); out=root/'.kaggle-c003-isolated'; out.mkdir(exist_ok=True)
          for key in ('KAGGLE_API_TOKEN','KAGGLE_USERNAME','KAGGLE_PRIVATE_DATASET'):
              if not os.environ.get(key): raise RuntimeError('Missing required secret: '+key)
          source=os.environ['GITHUB_SHA']; token=f"{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          candidate='MASTER_CLONE_GATE_08_15_CANDIDATE_003'
          slug=f"zaskaleta-c003-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          handle=f"{os.environ['KAGGLE_USERNAME']}/{slug}"
          bundle=out/'source_bundle.zip'
          with bundle.open('wb') as f: subprocess.run(['git','archive','--format=zip',source],stdout=f,check=True)
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          names=['kaggle/autopilot_kernel_c003.py','kaggle/first_gate_alignment_render.py','kaggle/auto_prepare.py','kaggle/verified_c003_entry.py','worker/lipsync_musetalk.py','worker/voice_mms_openvoice.py','content/talking_profile_v2.json','content/clone_reference_profile.json','content/master_clone_package.json']
          manifest={'run_token':token,'source_sha':source,'candidate_id':candidate,'bundle_sha256':sha(bundle),'source_hashes':{n:sha(root/n) for n in names}}
          (out/'run_identity.json').write_text(json.dumps(manifest,indent=2)+'\n')
          (out/'verified_c003_entry.py').write_bytes((root/'kaggle/verified_c003_entry.py').read_bytes())
          metadata={'id':handle,'title':'Zaskaleta C003 isolated '+token,'code_file':'verified_c003_entry.py','language':'python','kernel_type':'script','is_private':True,'enable_gpu':True,'enable_internet':True,'dataset_sources':[os.environ['KAGGLE_PRIVATE_DATASET'].strip()],'competition_sources':[],'kernel_sources':[]}
          (out/'kernel-metadata.json').write_text(json.dumps(metadata,indent=2)+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('C003_KERNEL='+handle+'\nC003_TOKEN='+token+'\nC003_SOURCE='+source+'\n')
          print('Prepared isolated kernel',handle,'source',source,'token',token)
          PY
      - name: Submit exact C003 and fail closed on GPU rejection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,re,subprocess,sys
          cmd=['kaggle','kernels','push','-p','.kaggle-c003-isolated','--timeout','7200','--accelerator','gpu']
          p=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=180)
          print(p.stdout,flush=True)
          if p.returncode: raise RuntimeError('Kaggle rejected submission; no old kernel will be followed')
          match=re.search(r'Kernel version\s+(\d+)\s+successfully pushed',p.stdout,re.I)
          if not match: raise RuntimeError('Kaggle did not confirm a new kernel version; refusing to follow any kernel')
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('C003_VERSION='+match.group(1)+'\n')
          print('Accepted exact isolated kernel version',match.group(1))
          PY
      - name: Wait for exact C003 evidence and download safe files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess,time
          import kagglehub
          handle=os.environ['C003_KERNEL']; token=os.environ['C003_TOKEN']; source=os.environ['C003_SOURCE']
          candidate='MASTER_CLONE_GATE_08_15_CANDIDATE_003'; base='first_gate_alignment/'+candidate
          out=pathlib.Path('.kaggle-review'); out.mkdir(exist_ok=True)
          def sha(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for chunk in iter(lambda:f.read(1048576),b''): h.update(chunk)
              return h.hexdigest()
          def get(name):
              p=kagglehub.notebook_output_download(handle,path=name,output_dir=str(out),force_download=True)
              p=pathlib.Path(p)
              if p.is_dir(): p=p/name
              if not p.is_file(): raise RuntimeError('Expected output file missing: '+name)
              return p
          deadline=time.monotonic()+7200; status=None; evidence=None
          while time.monotonic()<deadline:
              p=subprocess.run(['kaggle','kernels','status',handle],capture_output=True,text=True,timeout=60)
              message=p.stdout+'\n'+p.stderr
              print(message,flush=True)
              if any(x in message.upper() for x in ('ERROR','CANCELLED','FAILED')): raise RuntimeError('Isolated Kaggle kernel failed: '+message)
              try:
                  status=json.loads(get('zaskaleta_autopilot_status.json').read_text())
                  if status.get('run_token')!=token or status.get('source_sha')!=source: raise RuntimeError('Stale or wrong run identity')
                  if status.get('state')=='FAILED_CLOSED': raise RuntimeError('C003 renderer failed closed: '+str(status.get('error')))
                  if status.get('state')=='WAITING_FOR_PRIVATE_ASSETS': raise RuntimeError('Required private assets are unavailable')
                  if status.get('state')=='FIRST_GATE_CANDIDATE_003_READY_FOR_MANUAL_REVIEW':
                      evidence=json.loads(get(base+'.evidence.json').read_text()); break
              except (FileNotFoundError,ValueError,KeyError): pass
              except Exception as exc:
                  if isinstance(exc,RuntimeError) and ('Stale' in str(exc) or 'failed closed' in str(exc) or 'private assets' in str(exc)): raise
                  print('Exact output not yet published:',type(exc).__name__,str(exc)[:300],flush=True)
              time.sleep(20)
          if evidence is None: raise RuntimeError('Timed out waiting for exact C003 evidence')
          assert status['schema']=='zaskaleta-kaggle-autopilot-status-v6'
          assert status['first_gate_candidate_id']==candidate and status['render_completed'] is True
          assert status['promotion_allowed'] is False and status['auto_promote'] is False
          assert status['stable_release_modified'] is False
          assert evidence['candidate_id']==candidate and evidence['technical_gate_pass'] is True
          assert evidence['run_token']==token and evidence['source_sha']==source
          assert evidence['single_component_change']=='audio_alignment'
          assert evidence['lipsync_sample_rate']==16000 and evidence['final_audio_sample_rate']==24000
          assert 8<=evidence['render_duration_seconds']<=15
          assert evidence['subjective_identity_review']=='PENDING_MANUAL_REVIEW'
          assert evidence['promotion_allowed'] is False and evidence['auto_promote'] is False
          assert evidence['stable_release_modified'] is False
          video=get(base+'.mp4'); provenance=get(base+'.provenance.json')
          assert sha(video)==evidence['render_sha256']
          assert sha(provenance)==evidence['provenance_sha256']
          subprocess.run(['ffprobe','-v','error','-show_entries','format=duration:stream=codec_type,codec_name,width,height,sample_rate','-of','json',str(video)],check=True,timeout=60)
          import shutil
          shutil.copy2(video,out/(candidate+'.mp4'))
          shutil.copy2(provenance,out/(candidate+'.provenance.json'))
          (out/'C003_verified_manifest.json').write_text(json.dumps({'kernel':handle,'run_token':token,'source_sha':source,'candidate_id':candidate,'render_sha256':sha(video),'provenance_sha256':sha(provenance),'manual_review':'PENDING_MANUAL_REVIEW','auto_promote':False},indent=2)+'\n')
          print('VERIFIED_C003_RENDER',candidate,sha(video),flush=True)
          PY
      - name: Upload verified C003 for manual review
        uses: actions/upload-artifact@v4
        with:
          name: master-clone-c003-isolated-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .kaggle-review/MASTER_CLONE_GATE_08_15_CANDIDATE_003.mp4
            .kaggle-review/MASTER_CLONE_GATE_08_15_CANDIDATE_003.provenance.json
            .kaggle-review/C003_verified_manifest.json
          if-no-files-found: error
          retention-days: 7
      - name: Safety summary
        if: always()
        run: |
          echo 'Isolated C003 only. No paid GPU provisioning, no stable overwrite, no automatic promotion.'
          echo 'Private identity photos, voice, and source videos must remain in the private Kaggle dataset.'
