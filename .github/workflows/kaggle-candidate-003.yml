name: Kaggle MASTER CLONE Candidate 003

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'kaggle/first_gate_alignment_render.py'
      - 'kaggle/autopilot_kernel_c003.py'
      - '.github/workflows/kaggle-candidate-003.yml'

permissions:
  contents: read

concurrency:
  group: kaggle-master-clone-candidate-003
  cancel-in-progress: true

jobs:
  submit-kaggle:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KERNEL_SLUG: ${{ secrets.KAGGLE_KERNEL_SLUG }}
      KAGGLE_PRIVATE_DATASET: ${{ secrets.KAGGLE_PRIVATE_DATASET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate required Kaggle secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}" || exit 2
          test -n "${KAGGLE_USERNAME:-}" || exit 2
          test -n "${KAGGLE_KERNEL_SLUG:-}" || exit 2
          test -n "${KAGGLE_PRIVATE_DATASET:-}" || exit 2
      - name: Install Kaggle CLI
        run: python -m pip install --disable-pip-version-check --quiet 'kaggle>=1.8.0'
      - name: Verify Kaggle authentication
        run: kaggle datasets list -m --sort-by updated --max-size 1 >/dev/null
      - name: Build private Kaggle kernel package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .kaggle-c003 && mkdir -p .kaggle-c003
          cp kaggle/autopilot_kernel_c003.py .kaggle-c003/autopilot_kernel.py
          python - <<'PY'
          import json, os, pathlib
          meta={
            'id':f"{os.environ['KAGGLE_USERNAME']}/{os.environ['KAGGLE_KERNEL_SLUG']}",
            'title':'Zaskaleta MASTER CLONE Candidate 003',
            'code_file':'autopilot_kernel.py',
            'language':'python','kernel_type':'script','is_private':True,
            'enable_gpu':True,'enable_internet':True,
            'dataset_sources':[os.environ['KAGGLE_PRIVATE_DATASET'].strip()],
            'competition_sources':[],'kernel_sources':[]
          }
          pathlib.Path('.kaggle-c003/kernel-metadata.json').write_text(json.dumps(meta,indent=2)+'\n')
          PY
      - name: Submit and run CANDIDATE_003
        run: kaggle kernels push -p .kaggle-c003 --timeout 7200 --accelerator gpu
      - name: Follow Kaggle render logs
        shell: bash
        run: |
          set -euo pipefail
          KERNEL="${KAGGLE_USERNAME}/${KAGGLE_KERNEL_SLUG}"
          timeout 6600 kaggle kernels logs "$KERNEL" --follow --interval 15 || rc=$?
          rc=${rc:-0}; [ "$rc" -ne 124 ] || exit 1
          status_out="$(kaggle kernels status "$KERNEL" 2>&1 || true)"; echo "$status_out"
          ! echo "$status_out" | grep -Eq 'ERROR|CANCEL|FAILED'
      - name: Wait for Kaggle output publication
        shell: bash
        run: |
          set -euo pipefail
          KERNEL="${KAGGLE_USERNAME}/${KAGGLE_KERNEL_SLUG}"
          for attempt in $(seq 1 25); do
            status_out="$(kaggle kernels status "$KERNEL" 2>&1 || true)"; echo "$status_out"
            if echo "$status_out" | grep -Eq 'ERROR|CANCEL|FAILED'; then exit 1; fi
            if echo "$status_out" | grep -Eq 'COMPLETE|SUCCESS'; then exit 0; fi
            sleep 120
          done
      - name: Download candidate 003 safe outputs
        shell: bash
        run: |
          set -euo pipefail
          KERNEL="${KAGGLE_USERNAME}/${KAGGLE_KERNEL_SLUG}"
          rm -rf .kaggle-export .kaggle-review && mkdir -p .kaggle-export .kaggle-review
          kaggle kernels output "$KERNEL" -p .kaggle-export -q
          STATUS_FILE="$(find .kaggle-export -type f -name 'zaskaleta_autopilot_status.json' -print -quit)"
          VIDEO_FILE="$(find .kaggle-export -type f -name 'MASTER_CLONE_GATE_08_15_CANDIDATE_003.mp4' -print -quit)"
          PROV_FILE="$(find .kaggle-export -type f -name 'MASTER_CLONE_GATE_08_15_CANDIDATE_003.provenance.json' -print -quit)"
          test -n "$STATUS_FILE" && test -n "$VIDEO_FILE" && test -n "$PROV_FILE"
          python - "$STATUS_FILE" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d.get('state')=='FIRST_GATE_CANDIDATE_003_READY_FOR_MANUAL_REVIEW'
          assert d.get('render_completed') is True
          assert 8 <= d.get('first_gate_render_duration_seconds',0) <= 15
          assert d.get('promotion_allowed') is False and d.get('auto_promote') is False
          assert d.get('stable_release_modified') is False
          print(d['state'], d['first_gate_render_duration_seconds'])
          PY
          cp "$VIDEO_FILE" "$PROV_FILE" .kaggle-review/
      - name: Upload candidate 003 for manual review
        uses: actions/upload-artifact@v4
        with:
          name: master-clone-first-gate-candidate-003-review
          path: .kaggle-review/
          if-no-files-found: error
          retention-days: 7
      - name: Safety summary
        if: always()
        run: |
          echo 'CANDIDATE_003 only; no stable overwrite or auto-promotion.'
          echo 'Raw biometric source assets remain private on Kaggle.'
