name: Kaggle MASTER CLONE Export Existing

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kaggle-export-existing.yml'

permissions:
  contents: read

concurrency:
  group: kaggle-master-clone-export-existing
  cancel-in-progress: true

jobs:
  export-existing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KERNEL_SLUG: ${{ secrets.KAGGLE_KERNEL_SLUG }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate required Kaggle secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}" || exit 2
          test -n "${KAGGLE_USERNAME:-}" || exit 2
          test -n "${KAGGLE_KERNEL_SLUG:-}" || exit 2

      - name: Install Kaggle clients
        run: python -m pip install --disable-pip-version-check --quiet 'kaggle>=1.8.0' 'kagglehub>=0.3.13'

      - name: Verify Kaggle authentication and completed kernel
        shell: bash
        run: |
          set -euo pipefail
          kaggle datasets list -m --sort-by updated --max-size 1 >/dev/null
          KERNEL="${KAGGLE_USERNAME}/${KAGGLE_KERNEL_SLUG}"
          status_out="$(kaggle kernels status "$KERNEL" 2>&1 || true)"
          echo "$status_out"
          echo "$status_out" | grep -q 'COMPLETE'

      - name: Download existing safe CANDIDATE_002 review files only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .kaggle-export kaggle-review
          mkdir -p .kaggle-export kaggle-review

          python - <<'PY'
          import os
          from pathlib import Path
          import kagglehub

          handle = f"{os.environ['KAGGLE_USERNAME']}/{os.environ['KAGGLE_KERNEL_SLUG']}"
          out = Path('.kaggle-export')
          files = [
              'zaskaleta_autopilot_status.json',
              'first_gate_naturalness/MASTER_CLONE_GATE_08_15_CANDIDATE_002.mp4',
              'first_gate_naturalness/MASTER_CLONE_GATE_08_15_CANDIDATE_002.provenance.json',
          ]
          for name in files:
              print(f'Downloading {name}')
              p = kagglehub.notebook_output_download(
                  handle,
                  path=name,
                  output_dir=str(out),
                  force_download=True,
              )
              print(p)
          PY

          STATUS_FILE="$(find .kaggle-export -type f -name 'zaskaleta_autopilot_status.json' -print -quit)"
          VIDEO_FILE="$(find .kaggle-export -type f -name 'MASTER_CLONE_GATE_08_15_CANDIDATE_002.mp4' -print -quit)"
          PROV_FILE="$(find .kaggle-export -type f -name 'MASTER_CLONE_GATE_08_15_CANDIDATE_002.provenance.json' -print -quit)"

          test -n "$STATUS_FILE"
          test -n "$VIDEO_FILE"
          test -n "$PROV_FILE"

          python - "$STATUS_FILE" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          assert d.get('state') == 'FIRST_GATE_CANDIDATE_002_READY_FOR_MANUAL_REVIEW'
          assert d.get('render_completed') is True
          assert d.get('first_gate_candidate_id') == 'MASTER_CLONE_GATE_08_15_CANDIDATE_002'
          duration = d.get('first_gate_render_duration_seconds', d.get('render_duration_seconds', 0))
          assert 8 <= duration <= 15
          assert d.get('promotion_allowed') is False
          assert d.get('auto_promote') is False
          assert d.get('stable_release_modified') is False
          assert d.get('raw_biometrics_written_to_github') is False
          print('FIRST_GATE_CANDIDATE_002_READY_FOR_MANUAL_REVIEW', duration)
          PY

          cp "$VIDEO_FILE" "$PROV_FILE" kaggle-review/

      - name: Upload candidate 002 for manual review
        uses: actions/upload-artifact@v4
        with:
          name: master-clone-first-gate-candidate-002-review
          path: kaggle-review/
          if-no-files-found: error
          retention-days: 7

      - name: Safety summary
        if: always()
        run: |
          echo 'Export-only workflow: no model execution and no new Kaggle render submission.'
          echo 'Only generated MP4 and provenance are uploaded; raw/private biometric sources remain outside GitHub.'
          echo 'No auto-promotion; stable release remains unchanged.'
